    pm: { text: 'お昼過ぎの出発がいいです。', memo: '12時以降に出発', ok: (f) => f.dep >= U.t('12:00') },
    eve: { text: '仕事のあとなので、17時以降の出発で。', memo: '17時以降に出発', ok: (f) => f.dep >= U.t('17:00') },
    by: { text: '', memo: '', ok: (f, q) => f.arr <= q.by },
  },
  PREF: {
    cheap: { text: 'できるだけ安くお願いします。', memo: 'できるだけ安く' },
    flex: { text: '予定が変わるかもしれないので、あとで変更できるきっぷがいいです。', memo: 'あとで変更できる運賃' },
    early: { text: 'できるだけ早く着きたいです。', memo: '到着がいちばん早い便' },
  },

  /* ===== 問題づくり ===== */
  // 1日ぶんの時刻表と運賃・残席
  table(dest, date, k) {
    const block = (DATA.blockMin[dest] || 100) * 60, base = this.BASE[dest] || 35000;
    const idx = U.shuffle(this.SLOTS.map((_, i) => i)).slice(0, 5).sort((a, b) => a - b);
    return idx.map((si, i) => {
      const dep = U.t(this.SLOTS[si]), hour = Math.floor(dep / 3600);
      const peak = hour < 9 || hour >= 17 ? 1.12 : hour >= 11 && hour < 15 ? 0.94 : 1;
      const flex = Math.round(base * peak * U.float(0.97, 1.05) / 100) * 100 + i * 30;
      const value = Math.round(flex * U.float(0.56, 0.66) / 100) * 100 + i * 20;
      const sup = Math.round(flex * U.float(0.36, 0.44) / 100) * 100 + i * 10;
      // 残席は「安い運賃ほど少ない」入れ子(フレックスの残席がその便の空席)
      const all = U.weighted([0, U.int(1, 3), U.int(4, 8), U.int(9, 20)], [1, 3, 3, 3]);
      const sv = Math.min(all, U.weighted([0, 1, 2, U.int(3, 6)], [3, 2, 2, 2]));
      const sp = Math.min(sv, U.weighted([0, 1, 2, U.int(3, 5)], [4, 2, 2, 1]));
      return {
        no: `TB ${this.NUM[dest] + 11 + si * 2}`, dep, arr: dep + block,
        fares: {
          flex: { price: flex, seats: all, open: true },
          value: { price: value, seats: sv, open: k >= 3 },
          super: { price: sup, seats: sp, open: k >= 21 },
        },
      };
    });
  },

  // 条件に合う運賃か
  fits(q, di, f, r) {
    const c = f.fares[r];
    return di === q.di && c.open && c.seats >= q.n && this.TIME[q.time].ok(f, q) && (q.pref !== 'flex' || r === 'flex');
  },

  // 正解(なければ null)
  solve(q) {
    const cand = [];
    q.days[q.di].flights.forEach((f, fi) => { for (const F of this.FARES) if (this.fits(q, q.di, f, F.k)) cand.push({ fi, r: F.k, f, price: f.fares[F.k].price }); });
    if (!cand.length) return null;
    if (q.pref === 'early') cand.sort((a, b) => (a.f.arr - b.f.arr) || (a.price - b.price));
    else cand.sort((a, b) => a.price - b.price);
    if (cand.length > 1 && q.pref !== 'early' && cand[0].price === cand[1].price) return 'tie';
    return { di: q.di, fi: cand[0].fi, r: cand[0].r };
  },

  gen(d) {
    const dests = Object.keys(this.BASE), out = [];
    for (let i = 0; i < this.N; i++) {
      const wantNone = i > 0 && U.chance(0.17);
      let q = null;
      for (let tries = 0; tries < 80; tries++) {
        const dest = U.pick(dests), k = U.chance(0.55) ? U.int(22, 45) : U.int(2, 20);
        const di = U.int(0, 2), date = U.addDays(d.date, k);
        const dates = [-1, 0, 1].map((x) => U.addDays(date, x - (di - 1)));
        const c = {
          dest, date, di, n: U.weighted([1, 2, 3, 4], [4, 3.5, 1.5, 1]),
          time: U.weighted(['any', 'am', 'pm', 'eve', 'by'], [2.5, 2, 2, 1.5, 2]),
          pref: U.weighted(['cheap', 'flex', 'early'], [5.5, 2, 2.5]),
          days: dates.map((dt) => ({ date: dt, flights: this.table(dest, dt, Math.round((U.D(dt) - U.D(d.date)) / 864e5)) })),
        };
        if (c.time === 'by') {
          const arrs = c.days[c.di].flights.map((f) => f.arr).sort((a, b) => a - b);
          c.by = Math.ceil((arrs[U.int(1, 3)] + 600) / 1800) * 1800;
        }
        const ans = this.solve(c);
        if (ans === 'tie') continue;
        if (wantNone ? ans !== null : ans === null) continue;
        // 条件を見落とすと間違えるような問題を多めにする
        if (ans && tries < 40) {
          const naive = this.naive(c);
          if (naive && naive.fi === ans.fi && naive.r === ans.r && U.chance(0.7)) continue;
        }
        q = c; q.ans = ans; break;
      }
      if (!q) continue;
      const per = Gen.person('JP');
      out.push({ ...per, id: Gen.uid++, kind: 'pax', title: per.sex === 'M' ? 'MR' : 'MS', age: U.int(22, 74), q, tab: 0, sel: null });
    }
    return out;
  },

  // 日付だけ合わせて、いちばん安い運賃を選んだ場合(条件の見落とし)
  naive(q) {
    let best = null;
    q.days[q.di].flights.forEach((f, fi) => { for (const F of this.FARES) { const c = f.fares[F.k]; if (c.open && c.seats > 0 && (!best || c.price < best.price)) best = { fi, r: F.k, price: c.price }; } });
    return best;
  },

  /* ===== 表示 ===== */
  timeText(q) { return q.time === 'by' ? `${U.hm(q.by)}までに着きたいです。` : this.TIME[q.time].text; },
  timeMemo(q) { return q.time === 'by' ? `${U.hm(q.by)}までに到着` : this.TIME[q.time].memo; },

  enter() {
    const d = Game.day;
    this.s = { guests: this.gen(d), idx: 0, cur: null, busy: false, ok: 0, ng: 0 };
    if (!Store.data.jobSeen.reserve) { Store.data.jobSeen.reserve = true; Store.save(); }
    document.getElementById('app').innerHTML = Hud.frame(`<div class="job-scene reserve-scene">
      <section class="panel job-rules" aria-label="予約のルール">
        <header class="ph"><b>予約のルール</b><small>RESERVATIONS</small></header>
        <ul class="rule-list">
          <li><b>日付</b>タブをお客様の日付に合わせる</li>
          <li><b>人数</b>運賃の残席が人数分あること</li>
          <li><b>時間</b>出発・到着時刻の希望に合う便</li>
          <li><b>安く</b>条件に合う中でいちばん安い運賃</li>
          <li><b>変更できる</b>フレックスでいちばん安いもの</li>
          <li><b>早く着く</b>到着がいちばん早い便の最安運賃</li>
          <li><b>合う便がない</b>「便がない」と伝える</li>
        </ul>
        <div class="job-prog" id="jprog"></div>
      </section>
      <section class="g-center">
        <div class="g-sign job-sign"><div class="gs-num reserve"><small>DESK</small>予</div><div class="gs-info"><div class="gs-flight">予約カウンター</div><div class="gs-dest">RESERVATIONS <span>今日は${U.jpShort(d.date)}</span></div></div></div>
        <div class="reader rs-reader" id="reader" aria-live="polite"></div>
        <div class="acts g-acts" id="jacts"></div>
      </section>
      <section class="panel job-log" aria-label="対応の記録"><header class="ph"><b>対応の記録</b><small>LOG</small></header><ul class="mini-log" id="jlog"></ul></section>
    </div>`);
    this.next();
    Toast.show('予約カウンターです。お客様の希望に合う便と運賃を探しましょう', 'info', 3800);
  },

  next() {
    const s = this.s;
    s.cur = s.guests[s.idx] || null; s.busy = false;
    if (!s.cur) { this.finish(); return; }
    this.render();
  },

  render(outKind, staff) {
    const s = this.s, g = s.cur, el = document.getElementById('reader'), N = s.guests.length;
    document.getElementById('jprog').innerHTML = `<div class="g-count"><b>${Math.min(s.idx + 1, N)}</b><span>/ ${N}人目</span></div><p class="small">正解 ${s.ok} · ミス ${s.ng}</p>`;
    if (!el || !g) return;
    const q = g.q, day = q.days[g.tab], dis = s.busy ? 'disabled' : '';
    const selF = g.sel ? q.days[g.sel.di].flights[g.sel.fi] : null;
    document.getElementById('jacts').innerHTML = `<button class="btn primary" data-act="book" ${g.sel && !s.busy ? '' : 'disabled'}>${g.sel ? `${selF.no} ${this.FARES.find((F) => F.k === g.sel.r).name}で予約` : '便と運賃を選んでください'}</button>
      <button class="btn danger" data-act="none" ${dis}>ご希望の便がないと伝える</button>`;
    const dest = DATA.airports[q.dest].name;
    const mood = outKind === 'bad' ? 'sad' : outKind ? 'happy' : 'neutral';
    const bubble = staff ? `<div class="bubble staff mini"><span class="who">あなた</span>${U.esc(staff)}</div>`
      : `<div class="bubble mini">${U.esc(`${U.jpShort(q.date)}に${dest.replace(/\(.*\)/, '')}まで、${q.n}人分の予約をお願いします。`)}</div>`;
    const cell = (f, fi, F) => {
      const c = f.fares[F.k], on = g.sel && g.sel.di === g.tab && g.sel.fi === fi && g.sel.r === F.k;
      if (!c.open) return '<td><span class="rs-cell off">受付終了</span></td>';
      if (c.seats <= 0) return '<td><span class="rs-cell off">満席</span></td>';
      return `<td><button class="rs-cell ${on ? 'sel' : ''}" data-act="cell" data-fi="${fi}" data-r="${F.k}" aria-pressed="${on}" ${dis}><b>¥${U.fmt(c.price)}</b><small>残${c.seats >= 9 ? '9+' : c.seats}</small></button></td>`;
    };
    el.innerHTML = `<div class="rs-left">
        <div class="reader-pax">${Art.figure(g, mood)}${bubble}</div>
        <dl class="rs-memo"><div><dt>行き先</dt><dd>${dest}</dd></div><div><dt>日付</dt><dd>${U.jpShort(q.date)}</dd></div><div><dt>人数</dt><dd>大人${q.n}名</dd></div><div><dt>時間</dt><dd>${this.timeMemo(q)}</dd></div><div><dt>希望</dt><dd>${this.PREF[q.pref].memo}</dd></div></dl>
      </div>
      <div class="rs-right">
        <div class="rs-tabs" role="tablist">${q.days.map((x, i) => `<button class="rs-tab" role="tab" data-act="tab" data-i="${i}" aria-selected="${i === g.tab}" ${dis}>${U.jpShort(x.date)}</button>`).join('')}</div>
        <p class="rs-head">${DATA.home.name} → ${dest} · ${U.jpShort(day.date)} · 大人1名の運賃</p>
        <table class="rs-table"><thead><tr><th>便</th><th>時刻</th>${this.FARES.map((F) => `<th>${F.name}<small>${F.note}</small></th>`).join('')}</tr></thead>
          <tbody>${day.flights.map((f, fi) => `<tr><td><b>${f.no}</b></td><td class="rs-time">${U.hm(f.dep)}<small>→${U.hm(f.arr)}</small></td>${this.FARES.map((F) => cell(f, fi, F)).join('')}</tr>`).join('')}</tbody></table>
      </div>`;
  },

  onAct(a, ds) {
    const s = this.s, g = s.cur; if (!g || s.busy) return;
    if (a === 'tab') { g.tab = +ds.i; this.render(); }
    else if (a === 'cell') { g.sel = { di: g.tab, fi: +ds.fi, r: ds.r }; Sfx.pop(); this.render(); }
    else if (a === 'book' && g.sel) this.decide('book');
    else if (a === 'none') this.decide('none');
  },
  onKey(e) { if (e.key === 'Enter' && this.s.cur && this.s.cur.sel) this.decide('book'); },

  // 選んだ運賃がなぜ違うのか
  whyWrong(q, sel) {
    const f = q.days[sel.di].flights[sel.fi], c = f.fares[sel.r];
    if (sel.di !== q.di) return `日付が違った(${U.jpShort(q.days[sel.di].date)}を予約した)`;
    if (!this.TIME[q.time].ok(f, q)) return `時間の希望(${this.timeMemo(q)})に合わない便だった`;
    if (c.seats < q.n) return `その運賃の残席が${q.n}名分なかった`;
    if (q.pref === 'flex' && sel.r !== 'flex') return '変更できない運賃だった';
    return q.pref === 'early' ? 'もっと早く着く便・安い運賃があった' : 'もっと安い運賃があった';
  },
  ansText(q) {
    const a = q.ans; if (!a) return '';
    const f = q.days[a.di].flights[a.fi], F = this.FARES.find((x) => x.k === a.r);
    return `${U.jpShort(q.days[a.di].date)} ${f.no}(${U.hm(f.dep)}発) ${F.name} ¥${U.fmt(f.fares[a.r].price)}`;
  },

  decide(kind) {
    const s = this.s, g = s.cur; if (!g || s.busy) return;
    const q = g.q, a = q.ans;
    let ok, why;
    if (kind === 'none') { ok = !a; why = ok ? '条件に合う便がなかった' : `予約できる便があった。正しくは ${this.ansText(q)}`; }
    else {
      ok = !!a && g.sel.di === a.di && g.sel.fi === a.fi && g.sel.r === a.r;
      why = ok ? this.ansText(q) : `${this.whyWrong(q, g.sel)}。${a ? `正しくは ${this.ansText(q)}` : '条件に合う便はなかった'}`;
    }
    const pts = ok ? 50 : -80, name = `${g.family} ${g.given}`, label = kind === 'none' ? '便がないと案内' : '予約';
    Game.addScore('mid', pts); Game.decision(ok);
    if (ok) { s.ok++; Sfx.good(); Toast.show(`<b>正解</b> ${U.esc(why)} <span class="pts">${U.signed(pts)}</span>`, 'ok', 2600); }
    else { s.ng++; Game.addSat(-4); Sfx.buzz(); Toast.show(`<b>ミス</b> ${U.esc(why)} <span class="pts">${U.signed(pts)}</span>`, 'bad', 5200); }
    Game.log({ area: 'mid', ok, name, flight: DATA.airports[q.dest].name.replace(/\(.*\)/, '') + '行き', text: ok ? `${label}(${why})` : why, pts });
    document.getElementById('jlog').insertAdjacentHTML('afterbegin', `<li class="${ok ? 'ok' : 'bad'}"><span>${ok ? 'OK' : 'ミス'}</span>${U.esc(name)} · ${label}</li>`);
    s.busy = true;
    this.render(ok ? 'good' : 'bad', kind === 'none' ? DATA.staff.reserve.none : DATA.staff.reserve.ok);
    setTimeout(() => { if (Game.scene !== this) return; s.idx++; this.next(); }, ok ? 700 : 1300);
  },

  update(dt) { Hud.tick(dt, 0); },

  finish() {
    const s = this.s, gf = Game.day.gateFlight;
    Modal.show({
      title: '予約カウンター 終了',
      body: `<div class="sumgrid three"><div><small>正解</small><b>${s.ok}</b></div><div><small>ミス</small><b>${s.ng}</b></div><div><small>ここでの点数</small><b>${U.fmt(Game.day.score.mid)}</b></div></div>
        <p>次は <b>${gf.gate}番搭乗口</b> で <b>${gf.no}</b> の搭乗案内です。</p>`,
      actions: [{ label: `${gf.gate}番搭乗口へ向かう`, cls: 'primary', run: () => Game.go('gate') }],
    });
  },
};

/* ===== 48-lost.js ===== */
/* ---------- 忘れ物センター(中堅スタッフに昇進すると加わる仕事) ----------
   お客様の話(品物・色・特徴・場所・時刻)と、見つかった物の記録を見比べて、持ち主の物を探す。
   保管場所が当空港ならお渡し、ほかの空港なら取り寄せ、どれも違えば「届いていない」 */
Scenes.lost = {
  timed: true,
  N: 6,
  KINDS: { wallet: '財布', phone: 'スマートフォン', umbrella: '折りたたみ傘', cap: '帽子', plush: 'ぬいぐるみ', earphones: 'イヤホン', keys: '鍵', book: '本', scarf: 'マフラー', watch: '腕時計', glasses: 'メガネケース', pouch: 'ポーチ' },
  COLORS: { 黒: '#24272b', 紺: '#1f3260', 茶色: '#7a4a25', 赤: '#c8342f', 白: '#f2f2ee', 灰色: '#8b9096', ピンク: '#f08db5', 緑: '#2f8a4e', 黄色: '#e2bd1c' },
  SIMILAR: { 黒: ['紺', '灰色'], 紺: ['黒', '緑'], 茶色: ['黒', '赤'], 赤: ['ピンク', '茶色'], 白: ['灰色', '黄色'], 灰色: ['白', '黒'], ピンク: ['赤', '白'], 緑: ['紺', '黄色'], 黄色: ['白', '茶色'] },
  MARKS: { 'キーホルダー付き': 'キーホルダーが付いています。', '名前のシール付き': '名前のシールが貼ってあります。', '星の模様': '星の模様が入っています。', 'しま模様': 'しま模様です。', 'ステッカー付き': 'ステッカーが貼ってあります。', '無地': '模様のない、無地のものです。' },
  SPOTS: ['保安検査場', '出発ロビーのベンチ', '到着ロビー', '2階のトイレ', 'ラウンジ', 'カフェの前'],

  /* ===== 問題づくり ===== */
  // 時刻は「今日の0時からの分」。マイナスは昨日
  tm(t) { const d = t < 0 ? '昨日' : '今日'; const x = ((t % 1440) + 1440) % 1440; return `${d} ${U.pad(Math.floor(x / 60))}:${U.pad(x % 60)}`; },
  whenText(t) { const x = ((t % 1440) + 1440) % 1440, h = Math.floor(x / 60); return t < 0 ? (h >= 17 ? `昨日の夜${h}時ごろ` : `昨日の${h}時ごろ`) : `今朝${h}時ごろ`; },

  gen(d) {
    const now = Math.floor(d.clock / 60), out = [], doms = Object.keys(DATA.airports).filter((k) => !DATA.airports[k].intl);
    const kinds = Object.keys(this.KINDS), colors = Object.keys(this.COLORS), marks = Object.keys(this.MARKS);
    for (let i = 0; i < this.N; i++) {
      const kind = U.pick(kinds), color = U.pick(colors), mark = U.pick(marks);
      const onBoard = U.chance(0.55), exists = i === 0 || !U.chance(0.2);
      const r = { kind, color, mark };
      let send = false;
      if (onBoard) {
        send = exists && U.chance(0.4);
        const from = U.pick(doms), num = 300 + U.int(1, 40) * 2;
        r.place = `TB ${num} 機内 ${U.int(3, 12)}${U.pick(['A', 'B', 'C', 'D', 'E', 'F'])}`;
        r.t = send ? -U.int(150, 420) : U.chance(0.4) ? -U.int(180, 400) : U.int(Math.min(360, now - 90), now - 50);
        r.from = DATA.airports[from].name.replace(/\(.*\)/, ''); r.flightNo = `TB ${num}`; r.seat = r.place.split(' ').pop();
        r.next = U.pick(doms.filter((x) => x !== from));
      } else {
        r.place = U.pick(this.SPOTS);
        r.t = U.chance(0.35) ? -U.int(120, 420) : U.int(Math.min(360, now - 100), now - 40);
      }
      // 見つかった物の記録
      const rec = (o) => ({ no: 'L-' + U.digits(4), kind, color, mark, place: r.place, store: 'here', ...o });
      const okT = () => r.t + (onBoard ? U.int(12, 45) : U.int(5, 35));
      const target = exists ? rec({ found: send ? r.t + U.int(160, 260) : okT(), store: send ? r.next : 'here' }) : null;
      const near = [
        () => rec({ mark: U.pick(marks.filter((m) => m !== mark)), found: okT() }),
        () => rec({ color: U.pick(this.SIMILAR[color]), found: okT() }),
        () => rec({ place: onBoard ? (U.chance(0.5) ? `TB ${+r.flightNo.slice(3) + U.pick([-2, 2, 20])} 機内 ${r.seat}` : `${r.flightNo} 機内 ${Seats.row(r.seat) + U.pick([-2, 1, 10])}${Seats.col(r.seat)}`) : U.pick(this.SPOTS.filter((x) => x !== r.place)), found: okT() }),
        () => rec({ found: r.t - U.int(60, 300) }),
      ];
      const recs = U.shuffle(near).slice(0, exists ? 3 : 4).map((f) => f());
      recs.push(rec({ kind: U.pick(kinds.filter((k) => k !== kind)), color: U.pick(colors), mark: U.pick(marks), found: okT() }));
      if (target) recs.push(target);
      for (const x of recs) { if (x.found > now - 3) x.found = now - U.int(3, 12); if (x.store !== 'here' && x.found <= r.t) x.found = r.t + 180; }
      const per = Gen.person(U.chance(0.15) ? U.pick(['US', 'KR', 'TW']) : 'JP');
      out.push({ ...per, id: Gen.uid++, kind: 'pax', title: per.sex === 'M' ? 'MR' : 'MS', age: U.int(10, 76), r, onBoard, recs: U.shuffle(recs), target, sel: null });
    }
    return out;
  },

  // 記録がお客様の物か(違えば、その理由)
  mismatch(g, x) {
    const r = g.r, tol = g.onBoard ? 0 : 15;
    if (x.kind !== r.kind) return `品物が違った(${this.KINDS[x.kind]})`;
    if (x.color !== r.color) return `色が違った(${x.color})`;
    if (x.mark !== r.mark) return `特徴が違った(${x.mark})`;
    if (x.place !== r.place) return `見つかった場所が違った(${x.place})`;
    if (x.found < r.t - tol) return `お客様がそこにいた時刻より前(${this.tm(x.found)})に見つかった物だった`;
    return null;
  },

  /* ===== 表示 ===== */
  enter() {
    this.s = { guests: this.gen(Game.day), idx: 0, cur: null, busy: false, ok: 0, ng: 0 };
    if (!Store.data.jobSeen.lost) { Store.data.jobSeen.lost = true; Store.save(); }
    document.getElementById('app').innerHTML = Hud.frame(`<div class="job-scene lost-scene">
      <section class="panel job-rules" aria-label="忘れ物の探し方">
        <header class="ph"><b>探し方</b><small>LOST &amp; FOUND</small></header>
        <ul class="rule-list">
          <li><b>見比べる</b>品物・色・特徴・見つかった場所が、すべて合う物</li>
          <li><b>時刻</b>お客様がそこにいた時刻より前に見つかった物は違う</li>
          <li><b>当空港で保管</b>選んで「お渡しする」</li>
          <li><b>ほかの空港で保管</b>選んで「取り寄せを手配」</li>
          <li><b>どれも違う</b>「届いていない」</li>
        </ul>
        <div class="job-prog" id="jprog"></div>
      </section>
      <section class="g-center">
        <div class="g-sign job-sign"><div class="gs-num lost"><small>DESK</small>?</div><div class="gs-info"><div class="gs-flight">忘れ物センター</div><div class="gs-dest">LOST &amp; FOUND <span>ただいま ${U.hm(Game.day.clock)}</span></div></div></div>
        <div class="reader lf-reader" id="reader" aria-live="polite"></div>
        <div class="acts g-acts" id="jacts"></div>
      </section>
      <section class="panel job-log" aria-label="対応の記録"><header class="ph"><b>対応の記録</b><small>LOG</small></header><ul class="mini-log" id="jlog"></ul></section>
    </div>`);
    this.next();
    Toast.show('忘れ物センターです。お客様の話と記録を見比べて、持ち主の物を探しましょう', 'info', 3800);
  },

  next() {
    const s = this.s;
    s.cur = s.guests[s.idx] || null; s.busy = false;
    if (!s.cur) { this.finish(); return; }
    this.render();
  },

  say(g) {
    const r = g.r, what = `${r.color}の${this.KINDS[r.kind]}`;
    const where = g.onBoard ? `${this.whenText(r.t)}に${r.from}から着いた${r.flightNo}便の機内、${r.seat}の座席に${what}を忘れてしまいました。` : `${this.whenText(r.t)}、${r.place}で${what}をなくしてしまいました。`;
    return where + this.MARKS[r.mark];
  },

  render(outKind, staff) {
    const s = this.s, g = s.cur, el = document.getElementById('reader'), N = s.guests.length;
    document.getElementById('jprog').innerHTML = `<div class="g-count"><b>${Math.min(s.idx + 1, N)}</b><span>/ ${N}人目</span></div><p class="small">正解 ${s.ok} · ミス ${s.ng}</p>`;
    if (!el || !g) return;
    const r = g.r, dis = s.busy ? 'disabled' : '', has = g.sel !== null && !s.busy;
    document.getElementById('jacts').innerHTML = `<button class="btn primary" data-act="here" ${has ? '' : 'disabled'}>お渡しする</button>
      <button class="btn" data-act="send" ${has ? '' : 'disabled'}>取り寄せを手配</button>
      <button class="btn danger" data-act="none" ${dis}>届いていない</button>`;
    const mood = outKind === 'bad' ? 'sad' : outKind ? 'happy' : 'neutral';
    const bubble = staff ? `<div class="bubble staff mini"><span class="who">あなた</span>${U.esc(staff)}</div>` : `<div class="bubble mini">${U.esc(this.say(g))}</div>`;
    el.innerHTML = `<div class="rs-left">
        <div class="reader-pax">${Art.figure(g, mood)}${bubble}</div>
        <dl class="rs-memo"><div><dt>品物</dt><dd>${this.KINDS[r.kind]}</dd></div><div><dt>色</dt><dd>${r.color}</dd></div><div><dt>特徴</dt><dd>${r.mark}</dd></div>
          <div><dt>場所</dt><dd>${g.onBoard ? `${r.flightNo}便 機内 ${r.seat}` : r.place}</dd></div><div><dt>時刻</dt><dd>${g.onBoard ? `${this.tm(r.t)} 着` : `${this.tm(r.t).split(' ')[0]} ${this.whenText(r.t).replace(/^(昨日の夜|昨日の|今朝)/, '')}`}</dd></div></dl>
      </div>
      <div class="rs-right">
        <p class="rs-head">見つかった物の記録(${g.recs.length}件)· 記録を選んでからボタンを押す</p>
        <div class="lf-list" role="group" aria-label="見つかった物">${g.recs.map((x, i) => `<button class="lf-rec ${g.sel === i ? 'sel' : ''}" data-act="rec" data-i="${i}" aria-pressed="${g.sel === i}" ${dis}>
          ${Art.lostItem(x.kind, this.COLORS[x.color], x.mark)}
          <span class="lf-main"><b>${this.KINDS[x.kind]}</b> · ${x.color} · ${x.mark}</span>
          <span class="lf-sub">${U.esc(x.place)} · ${this.tm(x.found)} 発見</span>
          <span class="lf-store ${x.store === 'here' ? '' : 'away'}">${x.store === 'here' ? '当空港で保管' : `${DATA.airports[x.store].name.replace(/\(.*\)/, '')}空港で保管`}</span>
          <span class="lf-no">${x.no}</span></button>`).join('')}</div>
      </div>`;
  },

  onAct(a, ds) {
    const s = this.s, g = s.cur; if (!g || s.busy) return;
    if (a === 'rec') { g.sel = +ds.i; Sfx.pop(); this.render(); }
    else if ((a === 'here' || a === 'send') && g.sel !== null) this.decide(a);
    else if (a === 'none') this.decide('none');
  },

  answer(g) { return !g.target ? 'none' : g.target.store === 'here' ? 'here' : 'send'; },

  decide(kind) {
    const s = this.s, g = s.cur; if (!g || s.busy) return;
    const ans = this.answer(g), t = g.target, x = kind === 'none' ? null : g.recs[g.sel];
    const where = t && t.store !== 'here' ? `${DATA.airports[t.store].name.replace(/\(.*\)/, '')}空港` : '';
    const right = t ? `正しくは ${t.no}(${ans === 'here' ? '当空港でお渡し' : `${where}から取り寄せ`})` : 'お客様の物は、まだ届いていなかった';
    let ok = false, why;
    if (kind === 'none') { ok = ans === 'none'; why = ok ? '似た物はあったが、お客様の物はまだ届いていなかった' : `お客様の物が届いていた。${right}`; }
    else if (x !== t) { why = `${x.no}は${this.mismatch(g, x) || 'お客様の物ではなかった'}。${right}`; }
    else if (kind !== ans) { why = ans === 'here' ? `${t.no}は当空港で保管している。その場でお渡しできた` : `${t.no}は${where}で保管している。取り寄せが必要だった`; }
    else { ok = true; why = ans === 'here' ? `${t.no}をお渡しした` : `${where}で保管している${t.no}の取り寄せを手配した`; }
    const pts = ok ? 50 : -80, name = `${g.family} ${g.given}`, label = { here: 'お渡し', send: '取り寄せ', none: '届いていない' }[kind];
    Game.addScore('mid', pts); Game.decision(ok);
    if (ok) { s.ok++; Sfx.good(); Toast.show(`<b>正解</b> ${U.esc(why)} <span class="pts">${U.signed(pts)}</span>`, 'ok', 2600); }
    else { s.ng++; Game.addSat(-4); Sfx.buzz(); Toast.show(`<b>ミス</b> ${U.esc(why)} <span class="pts">${U.signed(pts)}</span>`, 'bad', 5200); }
    Game.log({ area: 'mid', ok, name, flight: `${g.r.color}の${this.KINDS[g.r.kind]}`, text: why, pts });
    document.getElementById('jlog').insertAdjacentHTML('afterbegin', `<li class="${ok ? 'ok' : 'bad'}"><span>${ok ? 'OK' : 'ミス'}</span>${U.esc(name)} · ${label}</li>`);
    s.busy = true;
    const staff = kind === 'send' ? Talk.fill(DATA.staff.lost.send, { place: x && x.store !== 'here' ? `${DATA.airports[x.store].name.replace(/\(.*\)/, '')}空港` : 'ほかの空港' }) : DATA.staff.lost[kind];
    this.render(ok ? 'good' : 'bad', staff);
    setTimeout(() => { if (Game.scene !== this) return; s.idx++; this.next(); }, ok ? 700 : 1300);
  },

  update(dt) { Hud.tick(dt, 0); },

  finish() {
    const s = this.s, gf = Game.day.gateFlight;
    Modal.show({
      title: '忘れ物センター 終了',
      body: `<div class="sumgrid three"><div><small>正解</small><b>${s.ok}</b></div><div><small>ミス</small><b>${s.ng}</b></div><div><small>ここでの点数</small><b>${U.fmt(Game.day.score.mid)}</b></div></div>
        <p>次は <b>${gf.gate}番搭乗口</b> で <b>${gf.no}</b> の搭乗案内です。</p>`,
      actions: [{ label: `${gf.gate}番搭乗口へ向かう`, cls: 'primary', run: () => Game.go('gate') }],
    });
  },
};

/* ===== 50-result.js ===== */
/* ---------- 1日の結果 ---------- */
Scenes.result = {
  enter() {
    const d = Game.day, sd = Store.data, score = Game.dayScore();
    const acc = d.dec ? d.good / d.dec : 1;
    const stars = acc >= 0.95 && d.onTime && d.sat >= 80 ? 3 : acc >= 0.8 ? 2 : 1;
    const rankBefore = Game.rank(sd.total);
    const goals = d.goals.map((id) => ({ id, label: Goals.label(id, d), done: Goals.check(id, d) }));
    if (!d.saved) {
      d.saved = true;
      const prev = sd.best[d.n];
      sd.best[d.n] = { score: Math.max(prev ? prev.score : -Infinity, score), stars: Math.max(prev ? prev.stars : 0, stars) };
      sd.day = Math.max(sd.day, d.n + 1);
      // メダル(目標の達成)は日ごとに集める。前に取ったものは消えない
      const had = new Set(sd.medals[d.n] || []);
      d.newMedals = goals.filter((g) => g.done && !had.has(g.id)).length;
      goals.forEach((g) => { if (g.done) had.add(g.id); });
      sd.medals[d.n] = [...had];
      d.recordBest = !sd.bestDay || score > sd.bestDay.score;
      if (d.recordBest) sd.bestDay = { score, n: d.n };
      d.stars = stars; Store.addShift(d);
      Store.recalcTotal(); Store.save();
      const after = Game.rank(sd.total);
      d.rankUp = after.name !== rankBefore.name ? after : null;
      d.newBest = !prev || score > prev.score;
    }
    const r = Game.rank(sd.total), nx = Game.nextRank(sd.total);
    const prog = nx ? ((sd.total - r.min) / (nx.min - r.min)) * 100 : 100;
    const gs = d.gateStats || { boarded: 0, total: 0, lateMin: 0, offload: 0 };
    const verdict = stars === 3 ? 'すばらしい勤務でした' : stars === 2 ? 'よい勤務でした' : 'ミスを見直して、もう一度挑戦しましょう';
    const mark = (ok) => (ok === true ? '<span class="pill ok">OK</span>' : ok === 'partial' ? '<span class="pill warn">△</span>' : '<span class="pill bad">ミス</span>');
    const logs = (area) => d.log.filter((l) => l.area === area);
    const list = (arr) => (arr.length ? `<ul class="loglist">${arr.map((l) => `<li>${mark(l.ok)}<div><b>${U.esc(l.name)}</b> <small>${l.flight}</small><p>${U.esc(l.text)}</p></div><span class="lp ${l.pts < 0 ? 'neg' : ''}">${U.signed(l.pts)}</span></li>`).join('')}</ul>` : '<p class="mute">記録はありません</p>');
    const mistakes = d.log.filter((l) => l.ok === false).length;
    const ne = Progress.nextEvent(d.n);
    const parts = [['カウンター', d.score.counter]];
    if (d.mid) parts.push([DATA.jobs[d.mid].name, d.score.mid]);
    parts.push(['ゲート', d.score.gate], ['コンボ', d.score.combo]);

    document.getElementById('app').innerHTML = Hud.frame(`<div class="result">
      <div class="r-left">
        <section class="panel r-head">
          <div class="r-stars" aria-label="星${stars}つ">${[1, 2, 3].map((i) => Art.star(i <= stars)).join('')}</div>
          <div class="r-title"><p class="eyebrow">${U.jp(d.date)} · ${d.cfg.title}${Cloud.name() ? ` · ${U.esc(Cloud.name())}さん` : ''}</p><h2>${verdict}</h2>
            ${d.recordBest ? '<span class="pill ok">1日の最高記録を更新！</span>' : d.newBest ? '<span class="pill ok">この日の自己ベスト</span>' : ''}</div>
          <div class="r-score"><small>本日のスコア</small><b>${U.fmt(score)}</b></div>
        </section>
        <section class="metrics">
          <div class="metric"><small>判断の正確さ</small><b>${Math.round(acc * 100)}%</b><span>ミス ${mistakes}件</span></div>
          <div class="metric"><small>お客様満足度</small><b>${Math.round(d.sat)}</b><span>100点満点</span></div>
          <div class="metric"><small>${d.gateFlight.no} の出発</small><b>${d.onTime ? '定刻' : `${gs.lateMin}分遅れ`}</b><span>${gs.offload ? `荷物の取り降ろし ${gs.offload}分` : `搭乗 ${gs.boarded}/${gs.total}名`}</span></div>
          <div class="metric"><small>最大コンボ</small><b>${d.maxCombo}</b><span>ボーナス ${U.fmt(d.score.combo)}点</span></div>
        </section>
        <section class="panel r-goals">
          <div class="rg-head"><b>今日の目標</b><span>メダル ${goals.filter((g) => g.done).length}/3${d.newMedals ? ` · 新しく${d.newMedals}個` : ''}</span></div>
          <ul>${goals.map((g) => `<li class="${g.done ? 'done' : ''}"><span class="medal" aria-hidden="true"></span>${U.esc(g.label)}<em>${g.done ? '達成' : '未達成'}</em></li>`).join('')}</ul>
        </section>
        <section class="panel r-rank">
          <div><small>ランク</small><b>${r.name}</b>${d.rankUp ? '<span class="pill ok">昇進！</span>' : ''}<span class="mute small"> 累計 ${U.fmt(sd.total)}点 · メダル ${Goals.medalCount()}個</span></div>
          <div class="rk-bar"><i style="width:${U.clamp(prog, 0, 100)}%"></i></div>
          <p class="mute small">${nx ? `次の「${nx.name}」まで あと${U.fmt(nx.min - sd.total)}点${nx.unlock ? `(${DATA.jobs[nx.unlock].name}の仕事が加わります)` : ''}` : '最高ランクです'}${ne ? ` · ${ne}日目は特別な日` : ''}</p>
        </section>
        <div class="r-actions">
          <button class="btn primary big" data-act="next">${d.n + 1}日目の勤務へ</button>
          <button class="btn" data-act="retry">この日をやり直す</button>
          <button class="btn ghost" data-act="title">タイトルへ</button>
          ${Cloud.user ? '<button class="btn ghost" data-act="g:ranking">ランキング</button>' : ''}
        </div>
      </div>
      <div class="panel r-logs">
        <p class="r-parts">${parts.map(([k, v]) => `<span>${k} <b>${U.fmt(v)}</b></span>`).join('<i>+</i>')}</p>
        <section><h3>チェックインカウンター</h3>${list(logs('counter'))}</section>
        ${d.mid ? `<section><h3>${DATA.jobs[d.mid].name}</h3>${list(logs('mid'))}</section>` : ''}
        <section><h3>${d.gateFlight.gate}番搭乗口</h3><p class="mute small">問題なく通したお客様 ${d.stats.scanned || 0}名(個別の記録は省略)</p>${list(logs('gate'))}</section>
      </div>
    </div>`);
    if (d.rankUp && !d.rankShown) {
      d.rankShown = true;
      const job = d.rankUp.unlock ? DATA.jobs[d.rankUp.unlock] : null;
      Sfx.chime();
      Modal.show({
        title: `昇進しました！「${d.rankUp.name}」`,
        body: job ? `<p>新しい仕事<b>「${job.name}」</b>が、次の勤務からカウンターと搭乗ゲートの間に加わります。</p><p class="mute">${job.desc} ルールはマニュアルにも追加されました。</p>` : '<p>これからもこの調子でがんばりましょう。</p>',
        actions: [{ label: 'やった！', cls: 'primary' }],
      });
    }
  },
  update(dt) { Hud.tick(dt, 0); },
  onAct(a) {
    const n = Game.day.n;
    if (a === 'next') Game.startDay(n + 1);
    else if (a === 'retry') Game.startDay(n);
    else if (a === 'title') Game.go('title');
  },
};

/* ===== 99-boot.js ===== */
/* ---------- 起動 ---------- */
(function () {
  const start = (snap) => Game.boot(snap || {});
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
