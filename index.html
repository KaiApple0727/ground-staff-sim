/* ---------- チェックインカウンター ---------- */
Scenes.counter = {
  timed: true,

  enter() {
    const d = Game.day;
    this.s = { pending: d.pax.slice(), queue: [], cur: null, step: null, nextIn: 0.2, skip: 0, ended: false, cut: new Set(), warned: new Set(), seatSel: null, reasonsOpen: false, qT: 0, served: 0, refused: 0, missed: 0 };
    document.getElementById('app').innerHTML = Hud.frame(`<div class="counter-scene">
      <section class="lobby panel" aria-label="ロビーの列">
        <header class="ph"><b>ロビーの列</b><small>QUEUE</small></header>
        <div class="queue" id="queue"></div>
        <div class="q-meta" id="qmeta"></div>
        <div class="q-actions">
          <button class="btn small" data-act="priority">締切が近い便を先に案内</button>
        </div>
        <div class="legend" id="legend"></div>
      </section>
      <section class="desk-area" aria-label="カウンター">
        <div class="pax-zone" id="paxzone"></div>
        <div class="desk" id="desk"></div>
      </section>
      <section class="terminal panel" id="term" aria-label="チェックイン端末"></section>
    </div>`);
    this.renderQueue(); this.renderIdle();
  },

  /* ===== 時間の進行 ===== */
  update(dt) {
    const d = Game.day, s = this.s, SC = CONFIG.score;
    // だれもカウンターにおらず列も空なら、次のお客様が来るまで一気に時間を進める(待ち時間をなくす)
    const idle = !s.cur && !s.queue.length && s.pending.length > 0;
    if (idle && !s.skip) s.skip = Math.max(d.cfg.speed * 4, (s.pending[0].arrival - d.clock) / 0.4);
    if (!idle) s.skip = 0;
    const speed = s.skip || d.cfg.speed;
    d.clock += dt * speed;
    let changed = false;

    while (s.pending.length && s.pending[0].arrival <= d.clock) { s.queue.push(s.pending.shift()); changed = true; }

    for (const f of d.flights) {
      if (f.canceled) continue;
      // 締切5分前の注意
      if (!s.warned.has(f.no) && d.clock >= f.cutoff - 300 && d.clock < f.cutoff) {
        s.warned.add(f.no);
        const n = s.queue.filter((p) => p.flight === f).length;
        if (n) Toast.show(`<b>${f.no}便 ${f.ap.name}行き</b>の締切まで約5分。列に${n}名並んでいます`, 'info', 4200);
      }
      // 締切
      if (!s.cut.has(f.no) && d.clock >= f.cutoff) {
        s.cut.add(f.no);
        const left = s.queue.filter((p) => p.flight === f && p.arrival <= f.cutoff);
        if (left.length) {
          s.queue = s.queue.filter((p) => !left.includes(p));
          left.forEach((p) => {
            s.missed++;
            Game.addScore('counter', SC.missedQueue); Game.addSat(-8); Game.decision(false);
            Game.log({ area: 'counter', ok: false, name: `${p.family} ${p.given}`, flight: f.no, text: '列で待っている間に手続きの締切を過ぎ、乗り遅れてしまった', pts: SC.missedQueue });
          });
          d.stats.missed = s.missed;
          Toast.show(`<b>${f.no}便の手続きを締め切りました。</b>列にいた${left.length}名が乗り遅れに <span class="pts">${U.signed(SC.missedQueue * left.length)}</span>`, 'bad', 4500);
          Sfx.buzz(); changed = true;
        } else Toast.show(`${f.no}便 ${f.ap.name}行きの手続きを締め切りました`, 'info');
        this.renderLegend();
      }
      if (!f.isGate && f.phase !== 'departed' && d.clock >= f.dep) f.phase = 'departed';
    }

    if (!s.cur && s.queue.length) { s.nextIn -= dt; if (s.nextIn <= 0) this.callNext(); }
    if (!s.ended && !s.cur && !s.queue.length && !s.pending.length) { s.ended = true; setTimeout(() => this.finish(), 500); }

    s.qT += dt;
    if (changed || s.qT > 1) { s.qT = 0; this.renderQueue(); if (!s.cur) this.renderTerm(); }
    Hud.tick(dt, d.cfg.speed, s.skip > 0);
  },

  /* ===== 列 ===== */
  renderQueue() {
    const s = this.s, d = Game.day, q = document.getElementById('queue'); if (!q) return;
    const shown = s.queue.slice(0, 16);
    q.innerHTML = shown.length
      ? shown.map((p) => {
        const mins = (p.flight.cutoff - d.clock) / 60, urgent = !p.flight.canceled && mins >= 0 && mins < 8;
        return `<div class="qp ${urgent ? 'urgent' : ''}" title="${p.flight.no}便 · 待ち${Math.max(0, Math.floor((d.clock - p.arrival) / 60))}分">${Art.mini(p.av, p.flight.color)}<span>${p.flight.num}</span></div>`;
      }).join('') + (s.queue.length > 16 ? `<div class="qmore">+${s.queue.length - 16}</div>` : '')
      : '<p class="q-empty">並んでいるお客様はいません</p>';
    document.getElementById('qmeta').innerHTML = `待ち <b>${s.queue.length}</b>名 · これから来るお客様 ${s.pending.length}名`;
    if (!document.getElementById('legend').innerHTML) this.renderLegend();
  },

  renderLegend() {
    const d = Game.day, el = document.getElementById('legend'); if (!el) return;
    el.innerHTML = '<small class="lg-title">担当する便</small>' + d.flights.map((f) => {
      if (f.canceled) return `<div class="lg-row cxl"><i class="chip" style="background:${f.color}"></i><b>${f.num}</b><span>${f.ap.name}</span><span class="lg-t">欠航 · 振替を受付</span></div>`;
      const cut = d.clock >= f.cutoff;
      return `<div class="lg-row ${cut ? 'cut' : ''}"><i class="chip" style="background:${f.color}"></i><b>${f.num}</b><span>${f.ap.name}</span><span class="lg-t">締切 ${U.hm(f.cutoff)}</span></div>`;
    }).join('');
  },

  priority() {
    const s = this.s, d = Game.day;
    const open = s.queue.filter((p) => !p.flight.canceled && d.clock < p.flight.cutoff);
    if (open.length < 2) { Toast.show('列が短いので、呼び出しは必要ありません', 'info'); return; }
    const soon = Math.min(...open.map((p) => p.flight.cutoff));
    const isU = (p) => !p.flight.canceled && p.flight.cutoff === soon;
    const urgent = s.queue.filter(isU);
    if (s.queue.slice(0, urgent.length).every(isU)) { Toast.show('締切が近い便のお客様は、すでに列の先頭です', 'info'); return; }
    s.queue = [...urgent, ...s.queue.filter((p) => !isU(p))];
    Game.addSat(-2);
    const f = urgent[0].flight;
    Toast.show(`「${f.num}便 ${f.ap.name}行きのお客様、お先にどうぞ」 ${urgent.length}名を先頭に案内しました`, 'info');
    Sfx.chimeShort(); this.renderQueue();
  },

  /* ===== お客様の呼び出し ===== */
  callNext() {
    const s = this.s, d = Game.day;
    const p = s.queue.shift();
    s.cur = p; s.step = 'docs'; s.nextIn = 0.2; s.seatSel = null; s.reasonsOpen = false; s.altSel = null;
    p.res = { pts: 0, bad: [], good: [] };
    p.sel = new Set(); p.tagThrough = false; p.estaShown = false;
    p.startAt = d.clock;
    p.mood = p.late || p.forgot ? 'surprised' : 'neutral';
    p.bs = p.bag ? { weighed: false, asked: false, battery: !!p.bag.battery, revealed: false } : null;
    if (d.clock - p.arrival > 15 * 60) Game.addSat(-4);
    document.getElementById('paxzone').innerHTML = `<div class="pax arrive" id="paxwrap"><div class="pax-fig" id="paxfig">${Art.figure(p, p.mood)}</div><div class="bubbles" id="bubbles"></div></div>`;
    this.talk(null, Talk.greet(p));
    this.renderDocs(); this.renderTerm(); this.renderQueue();
    Sfx.pop();
  },

  renderIdle() {
    const z = document.getElementById('paxzone'), desk = document.getElementById('desk');
    if (z) z.innerHTML = '<div class="pax-empty"><div class="open-sign"><b>チェックイン</b><span>CHECK-IN OPEN</span></div></div>';
    if (desk) desk.innerHTML = '<p class="desk-empty">次のお客様の書類がここに置かれます</p>';
    this.renderTerm();
  },

  talk(staffLine, pax) {
    const b = document.getElementById('bubbles'); if (!b) return;
    let h = '';
    if (staffLine) h += `<div class="bubble staff"><span class="who">あなた</span>${U.esc(staffLine)}</div>`;
    if (pax) h += `<div class="bubble pax ${staffLine ? 'later' : ''}">${U.esc(pax.main)}${pax.gloss ? `<small>${U.esc(pax.gloss)}</small>` : ''}</div>`;
    b.innerHTML = h;
  },

  mood(m) { const p = this.s.cur; if (!p) return; p.mood = m; const fig = document.getElementById('paxfig'); if (fig) fig.innerHTML = Art.figure(p, m); },

  later(ms, fn) { const p = this.s.cur; setTimeout(() => { if (Game.scene === this && this.s.cur === p) fn(); }, ms); },

  /* ===== デスクの上 ===== */
  renderDocs() {
    const p = this.s.cur, desk = document.getElementById('desk'); if (!p || !desk) return;
    const pp = p.flight.intl
      ? (p.passport ? Docs.passport(p.passport, p.av, p.photoAv) : '<div class="doc missing"><b>パスポートの提示なし</b><small>NO PASSPORT</small></div>')
      : '<div class="doc note"><b>国内線</b><small>パスポートの確認は不要</small></div>';
    desk.innerHTML = `<div class="docs">${pp}${Docs.ticket(p)}</div><div class="scale-area"><div id="scale"></div>${this.carryHTML(p)}${p.svc === 'minor' ? Docs.minorForm(p) : ''}</div><div class="printed" id="printed"></div>`;
    this.renderScale(false);
  },

  // 機内持ち込み手荷物(3日目から)。サイズ確認器の絵と、寸法・重さ
  carryHTML(p) {
    if (Game.day.n < 3 || !p.carry || p.rebook) return '';
    const c = p.carry, KN = { roller: 'キャリーケース', backpack: 'リュック', tote: 'トートバッグ' };
    return `<div class="carry-card ${p.carryCheck ? 'checked' : ''} ${c.items.length > 1 ? 'multi' : ''}" id="carry">
      <div class="carry-pics">${c.items.map((b) => Art.sizer(b)).join('')}</div>
      <div class="carry-info"><header><b>機内持ち込み</b><small>高さ×幅×奥行</small></header>
        ${c.items.map((b, i) => `<div class="carry-dim"><small>${KN[b.kind]}${c.items.length > 1 ? ` ${i + 1}` : ''}<span class="hw">(高さ×幅×奥行)</span></small><b>${b.h}×${b.w}×${b.d}<span>cm</span></b></div>`).join('')}
        <div class="carry-foot"><span>身の回り品 <b>${c.personal ? '1個' : 'なし'}</b></span><span>合計 <b>${c.kg.toFixed(1)}kg</b></span></div></div>
      ${p.carryCheck ? '<div class="carry-stamp">お預かり</div>' : ''}</div>`;
  },

  renderScale(anim) {
    const p = this.s.cur, el = document.getElementById('scale'); if (!el) return;
    const on = p && p.bag && p.bs && p.bs.weighed;
    el.innerHTML = `<div class="scale ${on ? 'on' : ''}">
      <div class="belt">${on ? Art.suitcase(p.bag.color) : '<span class="belt-label">手荷物はかり</span>'}</div>
      <div class="led-box"><span class="led-label">WEIGHT</span><span class="led-val" id="ledval">${on && !anim ? p.bag.weight.toFixed(1) : '--.-'}</span><span class="led-unit">kg</span></div>
    </div>`;
    if (on && anim) {
      const target = p.bag.weight, t0 = performance.now(), v = document.getElementById('ledval');
      const step = (t) => {
        if (!v.isConnected) return;
        const k = Math.min(1, (t - t0) / 700);
        v.textContent = k < 1 ? (target * k + (Math.random() - 0.5) * 2 * (1 - k)).toFixed(1) : target.toFixed(1);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  },

  /* ===== 端末 ===== */
  renderTerm() {
    const s = this.s, p = s.cur, t = document.getElementById('term'); if (!t) return;
    const root = document.querySelector('.counter-scene'); if (root) root.dataset.step = p ? s.step : 'idle';
    const steps = p && p.rebook ? [['docs', '書類'], ['rebook', '振替'], ['print', '発券']] : [['docs', '書類'], ['bag', '手荷物'], ['seat', '座席'], ['print', '発券']];
    const idx = s.step === 'bye' ? steps.length : steps.findIndex((x) => x[0] === s.step);
    const head = `<header class="ph"><b>チェックイン端末</b><small>CHECK-IN SYSTEM</small></header>
      <ol class="steps" style="grid-template-columns:repeat(${steps.length},1fr)">${steps.map((x, i) => `<li class="${p && i < idx ? 'done' : p && i === idx ? 'now' : ''}"><span>${i + 1}</span>${x[1]}</li>`).join('')}</ol>`;
    let body;
    if (!p) {
      const next = s.pending[0];
      body = `<div class="term-idle"><p>${s.queue.length ? 'お客様がカウンターに来ます…' : next ? '次のお客様が来るまで早送りしています…' : 'すべてのお客様の対応が終わりました'}</p></div>`;
    } else if (s.step === 'docs') body = this.termDocs(p);
    else if (s.step === 'bag') body = this.termBag(p);
    else if (s.step === 'seat') body = this.termSeat(p);
    else if (s.step === 'print') body = this.termPrint(p);
    else if (s.step === 'rebook') body = this.termRebook(p);
    else body = '<div class="term-idle"><p>お見送り中…</p></div>';
    t.innerHTML = head + `<div class="term-body">${body}</div>`;
  },

  booking(p) {
    const f = p.flight;
    return `<div class="booking"><div class="bk1"><b>${f.no}</b> ${f.ap.name}行き${f.canceled ? ' <span class="pill bad">欠航</span>' : ''}</div>
      <div><small>出発</small>${U.hm(f.dep)}</div><div><small>締切</small><b>${f.canceled ? '—' : U.hm(f.cutoff)}</b></div><div><small>搭乗口</small>${f.gate}</div><div><small>年齢</small>${p.age}歳</div></div>`;
  },

  termDocs(p) {
    const n = Game.day.n;
    const reasons = Object.entries(DATA.reasons).filter(([, r]) => r.day <= n);
    let hint = '';
    if (n <= 2) {
      hint = p.flight.intl
        ? `パスポートとeチケットの<b>名前</b>を1文字ずつ見比べましょう。${n >= 2 ? '<b>有効期限</b>が今日より前でないかも確認。' : ''}`
        : '国内線です。eチケットの<b>便名</b>と<b>搭乗日</b>を確認しましょう。';
    }
    let esta = '';
    if (n >= 5 && p.flight.ap.entry === 'ESTA') {
      if (!p.estaShown) esta = '<div class="acts"><button class="btn" data-act="esta">ESTAを照会する</button></div>';
      else {
        const e = p.esta, ok = p.nat === 'US' || (e && e.status === 'approved');
        const txt = p.nat === 'US' ? '米国籍のため不要' : !e || e.status === 'none' ? '該当する申請がありません' : e.status === 'expired' ? `期限切れ(${e.until.replace(/-/g, '/')} に失効)` : `承認済み(有効期限 ${e.until.replace(/-/g, '/')})`;
        esta = `<div class="sysbox ${ok ? 'ok' : 'ng'}"><small>ESTA照会結果</small>${txt}</div>`;
      }
    }
    return `${this.booking(p)}${hint ? `<p class="hint">${hint}</p>` : ''}${esta}
      <div class="acts">
        <button class="btn primary" data-act="docs-ok">問題なし・手続きを進める</button>
        <button class="btn danger" data-act="docs-refuse" aria-expanded="${this.s.reasonsOpen}">お断りする…</button>
      </div>
      ${this.s.reasonsOpen ? `<div class="reasons" role="group" aria-label="お断りの理由"><small>理由を選んでください</small>${reasons.map(([k, r]) => `<button class="btn reason" data-act="refuse" data-r="${k}">${r.label}</button>`).join('')}</div>` : ''}`;
  },

  // 特別な手配(6日目から)
  svcBox(p) {
    if (Game.day.n < 6) return '';
    return `<div class="svc-box"><small>特別な手配(必要なときだけ)</small><div class="svc-grid">${Object.entries(DATA.svc).map(([k, v]) => `<button class="btn small tog" data-act="svc" data-k="${k}" aria-pressed="${p.sel.has(k)}">${v.label}</button>`).join('')}</div></div>`;
  },

  termBag(p) {
    const n = Game.day.n, bs = p.bs;
    const carry = n >= 3 && p.carry ? `<div class="opt-row"><small>機内持ち込み</small><button class="btn small tog" data-act="carry" aria-pressed="${!!p.carryCheck}">持ち込めない荷物を預かる</button>${n === 3 ? '<span class="mute small">55×40×25cm・合計115cm・10kg・1個まで</span>' : ''}</div>` : '';
    if (!p.bag) return `${this.booking(p)}<p class="sub-h">預けるスーツケースはありません。</p>${carry}${this.svcBox(p)}<div class="acts"><button class="btn primary" data-act="bag-none">座席の指定へ</button></div>`;
    const tag = n >= 7 ? `<div class="opt-row"><small>荷物の行き先</small>
        <button class="btn small tog" data-act="tag" data-v="dest" aria-pressed="${!p.tagThrough}">${p.flight.dest} ${p.flight.ap.name}まで</button>
        <button class="btn small tog" data-act="tag" data-v="conn" aria-pressed="${p.tagThrough}">乗り継ぎ先まで</button></div>` : '';
    return `${this.booking(p)}
      <div class="baginfo"><div><small>無料手荷物</small><b>${p.allowance}kg</b> <span class="mute">${Rules.clsName(p)}</span></div>${n >= 3 ? '<div><small>1個の上限</small><b>32kg</b></div>' : ''}</div>
      <div class="acts">
        <button class="btn" data-act="weigh" ${bs.weighed ? 'disabled' : ''}>${bs.weighed ? '計量済み' : 'はかりに載せる'}</button>
        ${n >= 2 ? `<button class="btn" data-act="ask" ${bs.asked ? 'disabled' : ''}>${bs.asked ? '危険物 確認済み' : '危険物を確認する'}</button>` : ''}
      </div>
      ${bs.revealed && bs.battery ? '<div class="acts"><button class="btn warn" data-act="battery">バッテリーを取り出してもらう</button></div>' : ''}
      ${tag}${carry}${this.svcBox(p)}
      ${bs.weighed
        ? `<div class="acts row3">
          <button class="btn primary" data-act="bag-accept">このまま預かる</button>
          <button class="btn" data-act="bag-fee">超過料金を案内</button>
          ${n >= 3 ? '<button class="btn" data-act="bag-repack">詰め替えを依頼</button>' : ''}</div>`
        : `<p class="hint">まずは重さを量りましょう。${n <= 2 ? `無料は<b>${p.allowance}kg</b>まで。` : ''}</p>`}`;
  },

  termSeat(p) {
    const sel = this.s.seatSel, n = Game.day.n, bud = p.seatReq === 'buddy' && p.buddy && p.buddy.seat ? p.buddy : null;
    const req = p.seatReq === 'buddy' ? (bud ? `${bud.family}さん(${bud.seat})のとなり` : 'なし') : p.seatReq ? DATA.seatReq[p.seatReq] : 'なし';
    return `<div class="seat-meta"><span>クラス <b>${Rules.clsName(p)} (${p.cls})</b></span><span>${p.age}歳</span><span>希望 <b>${req}</b></span></div>
      ${SeatMap.html(p.flight.seats, sel, bud ? bud.seat : null)}
      <div class="seat-legend"><span><i class="lg free"></i>空席</span><span><i class="lg jj"></i>1〜2列 ビジネス</span>${n >= 5 ? '<span><i class="lg xx"></i>8列 非常口</span>' : ''}<span><i class="lg occ"></i>使用中</span></div>
      <div class="acts"><button class="btn primary" data-act="seat-ok" ${sel ? '' : 'disabled'}>${sel ? `${sel} で確定` : '座席を選んでください'}</button></div>`;
  },

  termRebook(p) {
    const f = p.flight, nd = p.rebook, sel = this.s.altSel;
    const want = nd.kind === 'by' ? `${nd.byText}までに着きたい` : nd.kind === 'pm' ? 'お昼過ぎ(12時以降)の出発がいい' : 'いちばん早い便がいい';
    return `${this.booking(p)}
      <div class="seat-meta"><span>お客様の希望 <b>${want}</b></span></div>
      <div class="alts" role="group" aria-label="振替先の便">${f.alts.map((a, i) => `<button class="alt ${sel === i ? 'sel' : ''}" data-act="alt" data-i="${i}" ${a.seats <= 0 ? 'disabled' : ''} aria-pressed="${sel === i}">
        <b>${a.no}</b><span>${a.tomorrow ? '<em>明日</em> ' : ''}${U.hm(a.dep)}発</span><span>${U.hm(a.arr)}着</span><span class="${a.seats <= 0 ? 'full' : ''}">${a.seats <= 0 ? '満席' : `空席 ${a.seats}`}</span></button>`).join('')}</div>
      <div class="acts"><button class="btn primary" data-act="rebook-ok" ${sel === null || sel === undefined ? 'disabled' : ''}>この便に振り替える</button></div>`;
  },

  termPrint(p) {
    if (p.newFlight) {
      const a = p.newFlight;
      return `<div class="print-sum"><div><small>振替先</small><b>${a.no}</b></div><div><small>出発</small><b>${a.tomorrow ? '明日 ' : ''}${U.hm(a.dep)}</b></div><div><small>座席</small><b>${p.seat}</b></div></div>
        <div class="acts"><button class="btn primary big" data-act="print">搭乗券を発行する</button></div>`;
    }
    return `${this.booking(p)}
      <div class="print-sum"><div><small>座席</small><b>${p.seat}</b></div><div><small>グループ</small><b>${Seats.group(p.seat)}</b></div><div><small>手荷物</small><b>${p.bag && p.bagAccepted ? '1個' : 'なし'}</b></div></div>
      <div class="acts"><button class="btn primary big" data-act="print">搭乗券を発行する</button></div>`;
  },

  /* ===== 操作 ===== */
  onAct(a, ds) {
    const s = this.s, p = s.cur;
    if (a === 'priority') { this.priority(); return; }
    if (!p || s.step === 'bye' || s.step === 'wait') return;
    switch (a) {
      case 'docs-ok': if (s.step === 'docs') this.docsOk(); break;
      case 'docs-refuse': s.reasonsOpen = !s.reasonsOpen; this.renderTerm(); break;
      case 'refuse': if (s.step === 'docs') this.refuse(ds.r); break;
      case 'weigh': this.weigh(); break;
      case 'ask': this.ask(); break;
      case 'battery': this.battery(); break;
      case 'bag-accept': this.bagDecide('accept'); break;
      case 'bag-fee': this.bagDecide('fee'); break;
      case 'bag-repack': this.bagDecide('repack'); break;
      case 'bag-none': this.evalSvc(p); this.evalCarry(p); this.toSeat(DATA.staff.noBag); break;
      case 'carry': this.toggleCarry(); break;
      case 'esta': if (!p.estaShown) { p.estaShown = true; this.talk(DATA.staff.estaQ, null); this.renderTerm(); } break;
      case 'svc': this.toggleSvc(ds.k); break;
      case 'tag': p.tagThrough = ds.v === 'conn'; this.renderTerm(); break;
      case 'alt': s.altSel = +ds.i; this.renderTerm(); break;
      case 'rebook-ok': this.rebookOk(); break;
      case 'seat': s.seatSel = ds.seat; this.renderTerm(); break;
      case 'seat-ok': this.seatOk(); break;
      case 'print': this.print(); break;
    }
  },

  docsOk() {
    const p = this.s.cur, d = Game.day, probs = Rules.docProblems(p, d);
    if (probs.length) { p.res.bad.push(DATA.reasons[probs[0]].miss); p.res.pts += CONFIG.score.missDoc; p.docMissed = true; Game.decision(false); d.stats.docMiss = (d.stats.docMiss || 0) + 1; }
    else Game.decision(true);
    this.s.reasonsOpen = false;
    if (p.rebook) { this.s.step = 'rebook'; this.talk(DATA.staff.docsOk, Talk.line(p, 'need_' + p.rebook.kind)); this.renderTerm(); return; }
    this.s.step = 'bag';
    this.talk(DATA.staff.docsOk, Talk.line(p, p.bag ? 'bagYes' : 'bagNo'));
    this.renderTerm(); this.renderScale(false);
  },

  toggleSvc(k) {
    const p = this.s.cur; if (!DATA.svc[k]) return;
    if (p.sel.has(k)) p.sel.delete(k); else { p.sel.add(k); this.talk(DATA.staff.svcDone[k], null); }
    this.renderTerm();
  },

  // 特別な手配の採点(手荷物の画面を出るときに1回)
  evalSvc(p) {
    if (p.svcEvaluated || Game.day.n < 6) return;
    p.svcEvaluated = true;
    const SC = CONFIG.score, need = new Set(Rules.svcNeeded(p));
    for (const k of Object.keys(DATA.svc)) {
      const want = need.has(k), got = p.sel.has(k);
      if (want && got) { p.res.good.push(DATA.svc[k].done); p.res.pts += SC.svcRight; Game.decision(true); }
      else if (want) { p.res.bad.push(DATA.svc[k].miss); p.res.pts += SC.svcMiss; Game.decision(false); }
      else if (got) { p.res.bad.push(`必要のない「${DATA.svc[k].label}」をしてしまった`); p.res.pts += SC.svcExtra; Game.decision(false); }
    }
  },

  // 機内持ち込み手荷物を預かりに回す(押すたびに切り替え)
  toggleCarry() {
    const p = this.s.cur; if (!p || !p.carry || this.s.step !== 'bag') return;
    p.carryCheck = !p.carryCheck;
    if (p.carryCheck) { this.talk(DATA.staff.carry, null); Sfx.pop(); }
    const el = document.getElementById('carry'); if (el) el.outerHTML = this.carryHTML(p);
    this.renderTerm();
  },

  // 機内持ち込み手荷物の採点(3日目から。手荷物の画面を出るときに1回)
  evalCarry(p) {
    if (p.carryEvaluated || Game.day.n < 3 || !p.carry) return;
    p.carryEvaluated = true;
    const SC = CONFIG.score, prob = Rules.carryProblem(p);
    if (prob && p.carryCheck) { p.res.good.push(`持ち込めない手荷物をお預かりした(${prob})`); p.res.pts += SC.carryRight; Game.decision(true); }
    else if (prob) { p.res.bad.push(`${prob}のに、そのまま機内に持ち込ませた`); p.res.pts += SC.carryMiss; Game.decision(false); }
    else if (p.carryCheck) { p.res.bad.push('機内に持ち込める手荷物まで預からせてしまった'); p.res.pts += SC.carryExtra; Game.decision(false); Game.addSat(-4); }
  },

  // 荷物の行き先の採点(7日目から)
  evalTag(p) {
    if (Game.day.n < 7 || !p.bag) return;
    const SC = CONFIG.score;
    if (p.conn && p.tagThrough) { p.res.good.push(`荷物を乗り継ぎ先の${DATA.cities[p.conn.dest].name}まで通した`); p.res.pts += SC.tagRight; Game.decision(true); }
    else if (p.conn) { p.res.bad.push('乗り継ぎ先まで荷物を通さなかった(到着地で預け直しになる)'); p.res.pts += SC.tagWrong; Game.decision(false); }
    else if (p.tagThrough) { p.res.bad.push('乗り継ぎがないのに、荷物を乗り継ぎ先までにしてしまった'); p.res.pts += SC.tagWrong; Game.decision(false); }
  },

  rebookOk() {
    const s = this.s, p = s.cur, f = p.flight, SC = CONFIG.score;
    const a = f.alts[s.altSel]; if (!a || a.seats <= 0) return;
    const best = Rules.bestAlt(f.alts, p.rebook) || Rules.bestAlt(f.alts, { kind: 'any' });
    const fits = Rules.altFits(a, p.rebook);
    const when = `${a.tomorrow ? '明日の' : ''}${U.hm(a.dep)}発 ${a.no}`;
    const st = Game.day.stats; st.rebooked = (st.rebooked || 0) + 1; if (a !== best) st.rebookNotBest = (st.rebookNotBest || 0) + 1;
    if (a === best) { p.res.good.push(`希望に合ういちばん早い便(${when})に振り替えた`); p.res.pts += SC.rebookBest; Game.decision(true); this.mood('happy'); }
    else if (fits) { p.res.partial = `希望には合っていたが、もっと早い ${best.no}(${U.hm(best.dep)}発)があった`; p.res.pts += SC.rebookOk; Game.decision(true); }
    else { p.res.bad.push(`お客様の希望に合わない便(${when})に振り替えた`); p.res.pts += SC.rebookBad; Game.decision(false); Game.addSat(-8); this.mood('upset'); }
    a.seats--;
    p.newFlight = a; p.seat = Seats.takeRandom(new Set(), 'Y');
    s.step = 'print';
    this.talk(Talk.fill(DATA.staff.rebook, { flight: a.no.replace('TB ', ''), dep: (a.tomorrow ? '明日の' : '') + U.hm(a.dep) }), null);
    this.renderTerm();
  },

  refuse(r) {
    const p = this.s.cur, d = Game.day, SC = CONFIG.score, probs = Rules.docProblems(p, d);
    this.s.reasonsOpen = false;
    if (!probs.length) {
      p.res.pts += SC.wrongRefuse; p.res.bad.push('問題のないお客様をお断りしてしまった');
      Game.decision(false); Game.addSat(-12); this.mood('upset');
      this.talk(DATA.staff.refuse[r], Talk.line(p, 'refusedAngry'));
    } else if (probs.includes(r)) {
      p.res.pts += SC.refuseRight; p.res.good.push(`正しくお断り(${DATA.reasons[r].label})`);
      Game.decision(true); this.mood('sad');
      this.talk(DATA.staff.refuse[r], Talk.line(p, 'refusedOk'));
    } else {
      p.res.pts += SC.refuseWrongReason; p.res.partial = `お断りは正解。ただし理由は「${DATA.reasons[probs[0]].label}」`;
      Game.decision(true); this.mood('sad');
      this.talk(DATA.staff.refuse[r], Talk.line(p, 'refusedOk'));
    }
    this.s.refused++;
    this.finishPax('refused');
  },

  weigh() {
    const p = this.s.cur; if (!p.bs || p.bs.weighed) return;
    p.bs.weighed = true;
    this.talk(DATA.staff.weigh, null);
    Sfx.thunk(); this.renderScale(true); this.renderTerm();
  },

  ask() {
    const p = this.s.cur; if (!p.bs || p.bs.asked) return;
    p.bs.asked = true;
    if (p.bs.battery) { p.bs.revealed = true; this.mood('surprised'); this.talk(DATA.staff.ask, Talk.line(p, 'dangerBattery')); }
    else this.talk(DATA.staff.ask, Talk.line(p, 'dangerNone'));
    this.renderTerm();
  },

  battery() {
    const p = this.s.cur; if (!p.bs || !p.bs.battery) return;
    p.bs.battery = false;
    p.res.pts += CONFIG.score.batteryCaught; p.res.good.push('モバイルバッテリーを見つけて取り出してもらった');
    Game.decision(true); this.mood('neutral');
    this.talk(DATA.staff.batteryOut, Talk.line(p, 'batteryOut'));
    this.renderTerm();
  },

  bagDecide(kind) {
    const p = this.s.cur, b = p.bag, bs = p.bs, SC = CONFIG.score;
    if (!b || !bs.weighed) return;
    const need = Rules.bagNeed(b.weight, p.allowance);
    const bad = (msg) => { p.res.bad.push(msg); p.res.pts += SC.bagMistake; Game.decision(false); };

    if (kind === 'repack') {
      if (need === 'repack') { p.res.good.push('32kgを超える荷物を詰め替えてもらった'); p.res.pts += SC.repackRight; Game.decision(true); }
      else if (need === 'fee') { Game.addSat(-3); Game.decision(true); }
      else { bad('重さに問題のない荷物を詰め替えさせてしまった'); Game.addSat(-6); this.mood('upset'); }
      b.weight = U.r1(U.float(Math.max(8, p.allowance - 9), p.allowance - 0.5));
      bs.weighed = false;
      this.talk(DATA.staff.repack, Talk.line(p, 'repack'));
      this.renderScale(false); this.renderTerm();
      return;
    }

    let reply = null;
    if (kind === 'fee') {
      if (need === 'fee') { p.res.good.push('超過料金を正しく案内した'); p.res.pts += SC.feeRight; Game.decision(true); reply = Talk.line(p, 'feeOk'); }
      else if (need === 'ok') { bad('重さが範囲内なのに超過料金を取ってしまった'); Game.addSat(-8); this.mood('upset'); reply = Talk.line(p, 'feeAngry'); }
      else bad('32kgを超える荷物を預かってしまった');
    } else {
      if (need === 'ok') Game.decision(true);
      else if (need === 'fee') bad(`無料の${p.allowance}kgを超えていたのに超過料金をいただかなかった`);
      else bad('32kgを超える荷物を預かってしまった');
    }
    if (bs.battery) bad('モバイルバッテリーが入ったまま預かってしまった');
    p.bagAccepted = true;
    this.evalTag(p); this.evalSvc(p); this.evalCarry(p);
    this.toSeat(kind === 'fee' ? DATA.staff.fee : DATA.staff.accept, reply);
  },

  // 座席の指定へ。直前のやりとり(係員のセリフ・お客様の返事)と座席の希望を一度に表示する
  toSeat(staffLine, reply) {
    const p = this.s.cur;
    this.s.step = 'seat'; this.s.seatSel = null;
    const line = Talk.line(p, p.seatReq ? 'seat_' + p.seatReq : 'seatNone');
    if (reply) { line.main = reply.main + ' ' + line.main; if (reply.gloss || line.gloss) line.gloss = [reply.gloss, line.gloss].filter(Boolean).join(' '); }
    this.talk(staffLine || null, line);
    this.renderTerm();
  },

  seatOk() {
    const s = this.s, p = s.cur, f = p.flight, seat = s.seatSel, SC = CONFIG.score;
    if (!seat || f.seats.has(seat)) return;
    const bud = p.seatReq === 'buddy' && p.buddy && p.buddy.seat ? p.buddy : null;
    const couldMeet = p.seatReq === 'buddy' ? !!bud && Seats.neighbors(bud.seat).some((x) => !f.seats.has(x) && Seats.clsOf(x) === p.cls) : p.seatReq ? Seats.anyFree(f.seats, p.cls, p.seatReq) : true;
    f.seats.add(seat); p.seat = seat;
    let reply = null;
    if (Seats.clsOf(seat) !== p.cls) {
      p.res.bad.push(p.cls === 'Y' ? 'エコノミーのお客様をビジネス席(1〜2列)にしてしまった' : 'ビジネスのお客様をエコノミー席にしてしまった');
      p.res.pts += SC.seatClass; Game.decision(false);
      if (p.cls === 'J') { Game.addSat(-10); this.mood('upset'); }
    } else if (Seats.isExit(seat) && !Rules.exitOk(p)) {
      const why = p.age < 15 ? `${p.age}歳` : p.infant ? '赤ちゃん連れ' : p.svc === 'wheelchair' ? '車いす' : 'ひとり旅のお子さま';
      p.res.bad.push(`非常口座席に、条件に合わないお客様(${why})を座らせてしまった`); p.res.pts += SC.exitBad; Game.decision(false);
    } else if (p.seatReq === 'exit' && !Rules.exitOk(p)) {
      p.res.good.push('条件に合わないため、非常口座席はご遠慮いただいた'); p.res.pts += SC.exitDeclined; Game.decision(true);
      s.seatSel = null; s.step = 'print';
      this.talk(DATA.staff.exitNo, Talk.line(p, 'exitNoOk'));
      this.renderTerm();
      return;
    } else if (p.seatReq === 'buddy') {
      if (!bud) Game.decision(true);
      else if (Seats.adjacent(seat, bud.seat)) { Game.day.stats.buddyMet = (Game.day.stats.buddyMet || 0) + 1; p.res.good.push(`お友だちの${bud.family}さんのとなりの席にした`); p.res.pts += SC.seatMet; Game.addSat(2); Game.decision(true); this.mood('happy'); }
      else if (couldMeet) { p.res.bad.push(`${bud.family}さんのとなりが空いていたのに、離れた席にした`); p.res.pts += SC.seatUnmet; Game.addSat(-5); Game.decision(false); reply = Talk.line(p, 'seatUnmet'); Game.day.stats.buddyMiss = (Game.day.stats.buddyMiss || 0) + 1; }
      else Game.decision(true);
    } else if (p.seatReq) {
      const label = DATA.seatReq[p.seatReq];
      if (Seats.matches(seat, p.seatReq)) { p.res.good.push(`ご希望の${label}の席にした`); p.res.pts += SC.seatMet; Game.addSat(2); Game.decision(true); this.mood('happy'); }
      else if (couldMeet) { p.res.bad.push(`${label}の空席があったのに、希望と違う席にした`); p.res.pts += SC.seatUnmet; Game.addSat(-5); Game.decision(false); reply = Talk.line(p, 'seatUnmet'); }
      else Game.decision(true);
    } else Game.decision(true);
    s.seatSel = null; s.step = 'print';
    this.talk(Talk.fill(DATA.staff.seat, { seat }), reply);
    this.renderTerm();
  },

  print() {
    const p = this.s.cur, f = p.flight, d = Game.day;
    if (this.s.step !== 'print') return;
    // 車いす・ひとり旅は手配していれば事前改札。赤ちゃん連れは自動で事前改札
    const priority = !!(p.infant || (p.svc && DATA.svc[p.svc] && DATA.svc[p.svc].priority && p.sel.has(p.svc)));
    const a = p.newFlight;
    const bp = a
      ? { family: p.ticket.family, given: p.ticket.given, title: p.ticket.title, flightNo: a.no, dest: f.dest, date: a.tomorrow ? U.addDays(d.date, 1) : d.date, gate: a.gate, boarding: U.hm(a.dep - 30 * 60), seat: p.seat, group: Seats.group(p.seat), priority: false }
      : { family: p.ticket.family, given: p.ticket.given, title: p.ticket.title, flightNo: f.no, dest: f.dest, date: d.date, gate: f.gate, boarding: U.hm(f.boarding), seat: p.seat, group: Seats.group(p.seat), priority, cls: p.cls };
    const pr = document.getElementById('printed');
    if (pr) pr.innerHTML = Docs.bpass(bp, 'printing') + (p.bag && p.bagAccepted ? Docs.bagtag(p, d.date, p.tagThrough) : '');
    Sfx.print();
    if (!a) (d.checked[f.no] = d.checked[f.no] || []).push({ nat: p.nat, sex: p.sex, family: p.ticket.family, given: p.ticket.given, title: p.ticket.title, av: p.av, seat: p.seat, cls: p.cls, hasBag: !!(p.bag && p.bagAccepted), priority, svc: p.svc || null, infant: !!p.infant, age: p.age });
    if (!p.docMissed) p.res.pts += CONFIG.score.serve;
    if (d.clock - p.startAt < 150 && !p.res.bad.length) p.res.pts += CONFIG.score.fast;
    this.talk(a ? 'こちらが新しい搭乗券です。ご迷惑をおかけして申し訳ございません。' : Talk.fill(DATA.staff.print, { gate: f.gate, board: U.hm(f.boarding) }), Talk.line(p, 'thanks'));
    if (!p.res.bad.length) this.mood('happy');
    this.s.served++;
    this.finishPax('served');
  },

  finishPax(outcome) {
    const s = this.s, p = s.cur;
    s.step = 'bye';
    Game.addScore('counter', p.res.pts);
    const ok = !p.res.bad.length;
    const text = ok ? (p.res.partial || p.res.good.join(' / ') || (outcome === 'served' ? '問題なく手続き完了' : 'お断り')) : p.res.bad.join(' / ');
    Game.log({ area: 'counter', ok: ok ? (p.res.partial ? 'partial' : true) : false, name: `${p.family} ${p.given}`, flight: p.flight.no, text, pts: p.res.pts });
    if (ok) { Toast.show(`<b>${p.res.partial ? 'おおむね正解' : '対応完了'}</b> ${p.res.partial || p.res.good[0] || ''} <span class="pts">${U.signed(p.res.pts)}</span>`, p.res.partial ? 'info' : 'ok'); Sfx.good(); }
    else { Toast.show(`<b>ミス</b> ${p.res.bad[0]} <span class="pts">${U.signed(p.res.pts)}</span>`, 'bad', 4600); Sfx.buzz(); }
    this.renderTerm();
    setTimeout(() => {
      if (Game.scene !== this || s.cur !== p) return;
      const w = document.getElementById('paxwrap'); if (w) w.classList.add('leaving');
      setTimeout(() => { if (Game.scene !== this || s.cur !== p) return; s.cur = null; s.step = null; s.nextIn = 0.05; this.renderIdle(); this.renderQueue(); }, 280);
    }, outcome === 'served' ? 950 : 850);
  },

  finish() {
    const s = this.s, d = Game.day, gf = d.gateFlight;
    if (Game.scene !== this) return;
    Modal.show({
      title: 'カウンター業務 終了',
      body: `<div class="sumgrid"><div><small>手続き完了</small><b>${s.served}名</b></div><div><small>お断り</small><b>${s.refused}名</b></div><div><small>乗り遅れ</small><b>${s.missed}名</b></div><div><small>ここまでのスコア</small><b>${U.fmt(d.score.counter)}</b></div></div>
        ${d.mid ? `<p>次は <b>${DATA.jobs[d.mid].name}</b>。そのあと ${gf.gate}番搭乗口で ${gf.no} の搭乗案内です。</p>` : `<p>次は <b>${gf.gate}番搭乗口</b> で <b>${gf.no} ${gf.ap.name}行き</b> の搭乗案内です。搭乗開始 ${U.hm(Math.max(gf.boarding, d.clock))}、ドアクローズ ${U.hm(gf.door)}。</p>`}`,
      actions: [{ label: d.mid ? `${DATA.jobs[d.mid].name}へ` : `${gf.gate}番搭乗口へ向かう`, cls: 'primary', run: () => Game.go(d.mid || 'gate') }],
    });
  },
};

/* ===== 40-gate.js ===== */
/* ---------- 搭乗ゲート ---------- */
Scenes.gate = {
  timed: true,

  enter() {
    const d = Game.day, f = d.gateFlight;
    d.clock = Math.max(d.clock, f.boarding);
    f.phase = 'boarding';
    const man = Gen.gateManifest(d);
    const ev = Gen.gateEvents(d, man);
    if (ev.newGate) f.gate = ev.newGate;   // 搭乗券は前の番号のまま
    this.s = {
      f, list: man.list, wrongs: man.wrongs, call: -1, line: [], cur: null, curVol: null, nextFeed: 0, curIn: 0, waiting: false, closed: false,
      finalAt: null, extraDelay: 0, announce: '', busy: false, doorWarned: false, scanned: 0, stT: 0,
      ev, ob: ev.ob || null, removed: ev.removed || null,
    };
    const s = this.s;
    for (const g of s.list) if (g.state === 'away' && g.arriveAt !== null && g.arriveAt <= d.clock) g.state = 'lounge';
    if (ev.newGate) s.announce = `搭乗口変更のお知らせです。つばさ航空${f.num}便、${f.ap.name}行きは、${ev.oldGate}番から${ev.newGate}番搭乗口に変更となりました。`;
    document.getElementById('app').innerHTML = Hud.frame(`<div class="gate-scene">
      <section class="panel g-status" id="gstatus" aria-label="搭乗状況"></section>
      <section class="g-center">
        <div class="g-sign" id="gsign"></div>
        <div class="reader" id="reader" aria-live="polite"></div>
        <div class="acts g-acts" id="gacts"></div>
        <p class="g-keys" id="gkeys"></p>
      </section>
      <section class="panel g-ann" id="gann" aria-label="アナウンス"></section>
    </div>`);
    this.renderAll();
    const notes = [];
    if (ev.newGate) notes.push(`<li><b>搭乗口変更</b> ${f.no}便は ${ev.oldGate}番 → <b>${ev.newGate}番</b> に変わりました。${d.n === 6 ? 'お客様の搭乗券には変更前の番号が書かれています。通してよいかは<b>便名</b>で決めましょう。' : ''}</li>`);
    if (s.removed) notes.push('<li><b>機材変更</b> 小さい飛行機に変わり、<b>11・12列の座席がなくなりました</b>。その列の搭乗券は「座席を変更して通す」。</li>');
    if (s.ob) notes.push(`<li><b>オーバーブッキング</b> 予約が座席より<b>${s.ob.need}名分</b>多くなっています。搭乗を始める前に、便を変えてくれるお客様を募りましょう。</li>`);
    if (notes.length) {
      Sfx.chimeShort();
      Modal.show({ soft: true, title: `${f.gate}番搭乗口からのお知らせ`, body: `<ul class="notice-list">${notes.join('')}</ul>`, actions: [{ label: 'わかりました', cls: 'primary' }] });
    } else Toast.show(`${f.gate}番搭乗口に着きました。まずは「事前改札」のアナウンスから始めましょう`, 'info', 4200);
  },

  // まだ搭乗の対象になっているお客様(振替に協力した人・お断りした人を除く)
  act() { return this.s.list.filter((g) => g.state !== 'rebooked' && g.state !== 'denied'); },
  obActive() { const ob = this.s.ob; return !!(ob && !ob.done); },

  update(dt) {
    const d = Game.day, s = this.s, f = s.f;
    for (const x of d.flights) if (!x.isGate && !x.canceled && x.phase !== 'departed' && d.clock >= x.dep) x.phase = 'departed';
    if (s.closed) { Hud.tick(dt, 0); return; }
    // 最終案内のあと、遅れているお客様を待つだけの時間は早送りする
    s.waiting = s.call >= 4 && !s.cur && !s.line.length && !s.list.some((g) => g.state === 'lounge') && !s.wrongs.some((w) => w.state === 'lounge');
    const speed = CONFIG.gateSpeed * (s.waiting ? 6 : 1);
    d.clock += dt * speed;
    let ch = false;

    for (const g of s.list) if (g.state === 'away' && g.arriveAt !== null && g.arriveAt <= d.clock) { g.state = 'lounge'; ch = true; }
    for (const w of s.wrongs) if (w.state === 'away' && w.spawnAt <= d.clock) w.state = 'lounge';

    // オーバーブッキング:協力を申し出たお客様が順に来る
    if (this.obActive() && s.ob.announced && !s.cur && !s.busy) {
      const c = s.ob.cands.shift();
      if (c) { s.cur = c.g; s.curVol = c; this.renderReader('in'); this.renderActs(); }
      else this.finishOb();
    }

    // 列が空になったら、すぐ次のお客様が並ぶ
    if (s.call >= 0 && (d.clock >= s.nextFeed || (!s.line.length && !s.cur))) {
      const c = this.pickNext();
      if (c) { c.state = 'line'; s.line.push(c); ch = true; }
      s.nextFeed = d.clock + U.int(3, 6);
    }
    if (!s.cur && s.line.length && !s.busy) {
      s.curIn -= dt;
      if (s.curIn <= 0) { s.cur = s.line.shift(); this.renderReader('in'); this.renderActs(); ch = true; }
    }
    if (!s.doorWarned && d.clock >= f.door) {
      s.doorWarned = true;
      Toast.show('<b>ドアクローズの時刻です。</b>これ以降は遅延になります。急いで搭乗を締め切りましょう', 'bad', 5000);
      Sfx.buzz();
    }
    if (ch) { this.renderStatus(); this.renderAnn(); }
    s.stT += dt;
    if (s.stT > 0.5) { s.stT = 0; this.renderSign(); this.renderAnnButtons(); }
    Hud.tick(dt, CONFIG.gateSpeed, s.waiting);
  },

  // 次に列に加わるお客様を選ぶ
  pickNext() {
    const s = this.s, items = [], w = [];
    for (const g of s.list) {
      if (g.state !== 'lounge') continue;
      if (g.group <= s.call) { items.push(g); w.push(3); }
      else if (g.impatient && !g.heldOnce) { items.push(g); w.push(1.1); }
    }
    for (const x of s.wrongs) if (x.state === 'lounge') { items.push(x); w.push(1.3); }
    return items.length ? U.weighted(items, w) : null;
  },

  eligibleWaiting() {
    const s = this.s;
    return s.list.some((g) => (g.state === 'lounge' || g.state === 'line') && g.group <= s.call) || (s.cur && s.cur.kind === 'pax' && !s.curVol && s.cur.group <= s.call);
  },
  canCall() { const s = this.s; return !s.closed && !this.obActive() && s.call < 4 && (s.call < 0 || !this.eligibleWaiting()); },
  canClose() { const s = this.s; return !s.closed && s.call >= 4 && !s.cur && !s.line.length; },
  isDisplaced(g) { const s = this.s; return !!(s.removed && g.kind === 'pax' && s.removed.includes(Seats.row(g.seat))); },

  /* ===== 表示 ===== */
  renderAll() { this.renderSign(); this.renderStatus(); this.renderReader(); this.renderActs(); this.renderAnn(); },

  renderSign() {
    const s = this.s, f = s.f, d = Game.day, el = document.getElementById('gsign'); if (!el) return;
    const left = Math.ceil((f.door - d.clock) / 60);
    const call = s.closed ? '締切' : this.obActive() ? '協力者募集' : s.call < 0 ? '準備中' : DATA.calls[s.call].label;
    const evs = [];
    if (s.ev.newGate) evs.push(`<span class="ev">搭乗口変更 ${s.ev.oldGate}→${s.ev.newGate}</span>`);
    if (s.removed) evs.push('<span class="ev">機材変更:11・12列なし</span>');
    el.innerHTML = `<div class="gs-num"><small>搭乗口 GATE</small>${f.gate}</div>
      <div class="gs-info"><div class="gs-flight">${f.no}</div><div class="gs-dest">${f.ap.name} <span>${f.ap.en}</span></div>
        <div class="gs-time">出発 ${U.hm(f.dep)} · ドアクローズ ${U.hm(f.door)} ${s.closed ? '' : left > 0 ? `<b>あと${left}分</b>` : `<b class="late">${-left}分超過</b>`}</div>
        ${evs.length ? `<div class="gs-ev">${evs.join('')}</div>` : ''}</div>
      <div class="gs-call"><small>案内中</small><b>${call}</b></div>`;
  },

  renderStatus() {
    const s = this.s, el = document.getElementById('gstatus'); if (!el) return;
    const pax = this.act(), boarded = pax.filter((g) => g.state === 'boarded').length;
    const rows = [0, 1, 2, 3].map((gr) => {
      const all = pax.filter((g) => g.group === gr);
      const on = all.filter((g) => g.state === 'boarded').length;
      const here = all.filter((g) => g.state === 'lounge' || g.state === 'line').length;
      const away = all.filter((g) => g.state === 'away').length;
      return `<tr class="${gr <= s.call ? 'called' : ''}"><td>${gr === 0 ? '事前改札' : 'グループ' + gr}</td><td>${on}/${all.length}</td><td>${here}</td><td>${away}</td></tr>`;
    }).join('');
    const missing = pax.filter((g) => g.state === 'away');
    const reb = s.list.filter((g) => g.state === 'rebooked').length, den = s.list.filter((g) => g.state === 'denied').length;
    el.innerHTML = `<header class="ph"><b>搭乗状況</b><small>BOARDING</small></header>
      <div class="g-count"><b>${boarded}</b><span>/ ${pax.length}名 搭乗済み</span></div>
      <div class="g-progress"><i style="width:${(boarded / Math.max(1, pax.length)) * 100}%"></i></div>
      <table class="gtable"><thead><tr><th></th><th>搭乗</th><th>ゲート前</th><th>未到着</th></tr></thead><tbody>${rows}</tbody></table>
      ${reb || den ? `<p class="g-line small">振替に協力 ${reb}名${den ? ` · 搭乗お断り ${den}名` : ''}</p>` : ''}
      <p class="g-line">列に並んでいる人: <b>${s.line.length + (s.cur && !s.curVol ? 1 : 0)}</b>名</p>
      <h4 class="sub-h">まだ来ていないお客様</h4>
      ${missing.length ? `<ul class="missing-list">${missing.slice(0, 4).map((g) => `<li><span>${U.esc(g.family)} ${U.esc(g.given)}</span><span class="mono">${g.seat}</span>${g.hasBag ? '<span class="pill warn">荷物あり</span>' : '<span class="pill">荷物なし</span>'}</li>`).join('')}</ul>${missing.length > 4 ? `<p class="mute small">ほか ${missing.length - 4}名</p>` : ''}` : '<p class="mute small">全員ゲートに来ています</p>'}`;
  },

  passData(g) { return { family: g.family, given: g.given, title: g.title, flightNo: g.flightNo, dest: g.dest, date: g.date, gate: g.gate, boarding: g.boarding, seat: g.seat, group: g.group, priority: g.priority, cls: g.cls || Seats.clsOf(g.seat) }; },

  renderReader(anim, outKind, staff) {
    const s = this.s, el = document.getElementById('reader'); if (!el) return;
    const g = s.cur;
    if (!g) {
      let title, sub = '';
      if (s.closed) title = '搭乗を締め切りました';
      else if (this.obActive()) { title = '搭乗の前に、協力者の募集'; sub = '右の「協力のお願いをアナウンス」を押すと、便の変更に協力してくれるお客様が来ます'; }
      else if (s.call < 0) { title = '搭乗を始めましょう'; sub = '右の「事前改札」をアナウンスすると、お客様が並び始めます'; }
      else if (s.waiting) { title = '最終案内のあと'; sub = 'まだ来ていないお客様を待っています(早送り中)。待つのをやめるなら「搭乗締切」'; }
      else { title = '次のお客様を呼んでいます'; sub = s.line.length ? '' : this.canCall() ? '案内中のグループは全員通りました。次のグループをアナウンスしましょう' : ''; }
      el.innerHTML = `<div class="reader-empty"><b>${title}</b><span>${sub}</span></div>`;
      return;
    }
    const mood = outKind === 'hold' || outKind === 'no' ? 'sad' : outKind === 'redirect' ? 'surprised' : outKind ? 'happy' : 'neutral';
    let bubble = '';
    if (staff) bubble = `<div class="bubble staff mini"><span class="who">あなた</span>${U.esc(staff)}</div>`;
    else if (s.curVol) { const l = Talk.line({ nat: g.nat, flight: s.f }, 'vol_' + s.curVol.kind); bubble = `<div class="bubble mini">${U.esc(l.main)}${l.gloss ? `<small>${U.esc(l.gloss)}</small>` : ''}</div>`; }
    el.innerHTML = `<div class="reader-pax">${Art.figure(g, mood, { noEscort: true })}${bubble}</div>
      <div class="reader-pass ${anim === 'in' ? 'in' : ''} ${outKind ? 'out-' + (outKind === 'scan' || outKind === 'reseat' ? 'scan' : 'hold') : ''}">${s.curVol ? '<div class="vol-tag">協力のお申し出</div>' : ''}${Docs.bpass(this.passData(g))}</div>`;
  },

  renderActs() {
    const s = this.s, el = document.getElementById('gacts'), keys = document.getElementById('gkeys'); if (!el) return;
    const dis = !s.cur || s.busy || s.closed ? 'disabled' : '';
    if (s.curVol || this.obActive()) {
      el.innerHTML = `<button class="btn primary" data-act="vol-today" ${dis}>後続便でお願い<span class="kbd">1</span></button>
        <button class="btn" data-act="vol-next" ${dis}>翌日の便でお願い<span class="kbd">2</span></button>
        <button class="btn danger" data-act="vol-no" ${dis}>今回は見送る<span class="kbd">3</span></button>`;
      if (keys) keys.innerHTML = 'キーボード: <span class="kbd">1</span>後続便 <span class="kbd">2</span>翌日の便 <span class="kbd">3</span>見送る <span class="kbd">A</span>アナウンス';
      return;
    }
    el.innerHTML = `<button class="btn primary" data-act="scan" ${dis}>通す(スキャン)<span class="kbd">1</span></button>
      <button class="btn" data-act="hold" ${dis}>お待ちいただく<span class="kbd">2</span></button>
      <button class="btn danger" data-act="redirect" ${dis}>ゲート違いを案内<span class="kbd">3</span></button>
      ${s.removed ? `<button class="btn warn" data-act="reseat" ${dis}>座席を変更して通す<span class="kbd">4</span></button>` : ''}`;
    if (keys) keys.innerHTML = `キーボード: <span class="kbd">1</span>通す <span class="kbd">2</span>待ってもらう <span class="kbd">3</span>ゲート違い ${s.removed ? '<span class="kbd">4</span>座席変更 ' : ''}<span class="kbd">A</span>アナウンス`;
  },

  renderAnn() {
    const s = this.s, el = document.getElementById('gann'); if (!el) return;
    const ob = s.ob;
    const obBox = ob ? `<div class="ob-box ${ob.done ? 'done' : ''}">
        <div class="ob-head"><b>オーバーブッキング</b><span>協力 <b>${ob.got}</b> / ${ob.need}名</span></div>
        ${ob.done ? '' : `<p>予約が座席より${ob.need}名分多い${s.removed ? '(機材変更のため)' : ''}。便を変えてくれる方を募ります。</p>
        <p class="small mute">後続便 ${ob.later.no} ${U.hm(ob.later.dep)}発=1万円 / 翌日=2万円+宿泊</p>`}</div>` : '';
    el.innerHTML = `<header class="ph"><b>アナウンス</b><small>ANNOUNCEMENT</small></header>${obBox}
      ${this.obActive() ? '<p class="calls-wait">搭乗の案内(事前改札〜最終案内)は、協力者の募集が終わってから</p>' : `<ol class="calls">${DATA.calls.map((c, i) => `<li class="${i <= s.call ? 'done' : i === s.call + 1 && !s.closed && !this.obActive() ? 'next' : ''}"><span class="cn">${i === 0 ? '0' : i === 4 ? '!' : i}</span><b>${c.label}</b><small>${c.sub}</small></li>`).join('')}</ol>`}
      <div id="annbtns"></div>
      <div class="ann-text">${s.announce ? `<span class="chime">ピンポーン</span>${U.esc(s.announce)}` : '<span class="mute">アナウンスはまだありません</span>'}</div>`;
    this.renderAnnButtons();
  },

  renderAnnButtons() {
    const s = this.s, el = document.getElementById('annbtns'); if (!el) return;
    let h;
    if (this.obActive() && !s.ob.announced) h = '<button class="btn primary" data-act="ob-ann">協力のお願いをアナウンス<span class="kbd">A</span></button>';
    else if (this.obActive()) h = `<p class="hint">協力を申し出たお客様に対応しています(残り${s.ob.cands.length + (s.curVol ? 1 : 0)}名)</p>`;
    else {
      const cc = this.canCall(), cl = this.canClose();
      const next = s.call < 4 ? DATA.calls[s.call + 1] : null;
      let why = '';
      if (!s.closed && next && !cc) why = '案内中のグループのお客様が全員通ると、次を案内できます';
      if (!s.closed && s.call >= 4 && !cl) why = '列のお客様の対応が終わると締め切れます';
      h = `${next && !s.closed ? `<button class="btn primary" data-act="call" ${cc ? '' : 'disabled'}>「${next.label}」をアナウンス<span class="kbd">A</span></button>` : ''}
        ${s.call >= 4 && !s.closed ? `<button class="btn danger big" data-act="close" ${cl ? '' : 'disabled'}>搭乗締切(ドアクローズ)</button>` : ''}
        ${why ? `<p class="hint">${why}</p>` : ''}`;
    }
    if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
  },

  /* ===== 操作 ===== */
  onAct(a) {
    if (a === 'call') this.callNext();
    else if (a === 'ob-ann') this.obAnnounce();
    else if (a === 'close') this.tryClose();
    else if (a === 'vol-today') this.volDecide('today');
    else if (a === 'vol-next') this.volDecide('next');
    else if (a === 'vol-no') this.volDecide('no');
    else if (a === 'scan' || a === 'hold' || a === 'redirect' || a === 'reseat') this.decide(a);
  },
  onKey(e) {
    const k = e.key.toLowerCase(), s = this.s;
    if (s.curVol) {
      if (k === '1') this.volDecide('today'); else if (k === '2') this.volDecide('next'); else if (k === '3') this.volDecide('no');
      return;
    }
    if (k === '1') this.decide('scan');
    else if (k === '2') this.decide('hold');
    else if (k === '3') this.decide('redirect');
    else if (k === '4' && s.removed) this.decide('reseat');
    else if (k === 'a') { if (this.obActive() && !s.ob.announced) this.obAnnounce(); else if (this.canCall()) this.callNext(); }
  },

  callNext() {
    const s = this.s, d = Game.day, f = s.f;
    if (!this.canCall()) return;
    s.call++;
    const c = DATA.calls[s.call];
    s.announce = Talk.fill(c.ann, { num: f.num, dest: f.ap.name, gate: f.gate });
    Sfx.chime(); Speech.say(s.announce);
    if (s.call === 4) {
      s.finalAt = d.clock;
      // 来ていないお客様は、最終案内から1分半以内に急いで来る(来ない人を除く)
      for (const g of s.list) if (g.state === 'away' && !g.neverShow) g.arriveAt = Math.min(g.arriveAt === null ? Infinity : g.arriveAt, d.clock + U.int(20, 90));
    }
    s.nextFeed = d.clock;
    this.renderAll();
  },

  /* ----- オーバーブッキング ----- */
  obAnnounce() {
    const s = this.s, f = s.f;
    if (!this.obActive() || s.ob.announced) return;
    s.ob.announced = true;
    s.announce = `つばさ航空${f.num}便、${f.ap.name}行きは、ご予約が座席数を上回っております。後の便へのご変更にご協力いただけるお客様は、搭乗口の係員までお申し出ください。協力金をご用意しております。`;
    Sfx.chime(); Speech.say(s.announce);
    this.renderAll();
  },

  volDecide(kind) {
    const s = this.s, c = s.curVol, ob = s.ob, SC = CONFIG.score;
    if (!c || s.busy) return;
    const g = c.g, full = ob.got >= ob.need, name = `${g.family} ${g.given}`;
    let pts = 0, ok = true, msg = '', good = '', staff;
    if (kind === 'no') {
      staff = DATA.staff.obAsk.no;
      if (c.kind === 'connect') { good = '乗り継ぎがあるお客様には、便の変更をお願いしなかった'; pts = SC.obDecline; }
      else if (full) { good = '必要な人数がそろっていたので、見送った'; pts = SC.obDecline; }
    } else {
      const today = kind === 'today';
      staff = today ? Talk.fill(DATA.staff.obAsk.today, { flight: ob.later.no.replace('TB ', '') }) : DATA.staff.obAsk.next;
      if (c.kind === 'connect') { ok = false; pts = SC.obBad; msg = '乗り継ぎがあるお客様に便の変更をお願いしてしまった(乗り継ぎに間に合わなくなる)'; g.state = 'rebooked'; ob.got++; }
      else if (full) { ok = false; pts = SC.obExtra; msg = '必要な人数より多く、便の変更をお願いしてしまった'; g.state = 'rebooked'; ob.got++; }
      else if (c.kind === 'today' && !today) { ok = false; pts = -30; msg = '今日中に着きたいお客様に翌日の便をお願いして、断られた'; }
      else {
        g.state = 'rebooked'; ob.got++;
        if (today) { good = `${ob.later.no}便への振り替えに協力していただいた(協力金1万円)`; pts = SC.obBest; }
        else { good = '翌日の便への振り替えに協力していただいた(協力金2万円と宿泊費)'; pts = c.kind === 'any' ? SC.obOk : SC.obBest; }
      }
    }
    Game.addScore('gate', pts); Game.decision(ok);
    if (!ok) { Game.log({ area: 'gate', ok: false, name, flight: s.f.no, text: msg, pts }); Toast.show(`<b>ミス</b> ${msg} <span class="pts">${U.signed(pts)}</span>`, 'bad', 4600); Sfx.buzz(); }
    else if (good) { Game.log({ area: 'gate', ok: true, name, flight: s.f.no, text: good, pts }); Toast.show(`<b>正解</b> ${good} <span class="pts">${U.signed(pts)}</span>`, 'ok'); Sfx.good(); }
    s.busy = true;
    this.renderReader(null, kind === 'no' ? 'no' : 'scan', staff); this.renderActs();
    setTimeout(() => {
      if (Game.scene !== this) return;
      s.cur = null; s.curVol = null; s.busy = false;
      this.renderAll();
    }, 650);
  },

  finishOb() {
    const s = this.s, ob = s.ob, SC = CONFIG.score;
    ob.done = true;
    const short = ob.need - ob.got;
    if (short > 0) {
      const pool = U.shuffle(this.act().filter((g) => g.state === 'lounge' && !g.priority));
      pool.slice(0, short).forEach((g) => {
        g.state = 'denied';
        Game.addScore('gate', SC.obShort); Game.decision(false); Game.addSat(-12);
        Game.log({ area: 'gate', ok: false, name: `${g.family} ${g.given}`, flight: s.f.no, text: '協力者が足りず、このお客様の搭乗をお断りすることになった', pts: SC.obShort });
      });
      Toast.show(`<b>協力者が${short}名足りませんでした。</b>${short}名のお客様の搭乗をお断りします <span class="pts">${U.signed(SC.obShort * short)}</span>`, 'bad', 5000);
      Sfx.buzz();
    } else Toast.show('必要な人数の協力者が見つかりました。「事前改札」から搭乗を始めましょう', 'ok', 4200);
    this.renderAll();
  },

  /* ----- 搭乗券の確認 ----- */
  decide(kind) {
    const s = this.s, g = s.cur, SC = CONFIG.score;
    if (!g || s.busy || s.closed || s.curVol) return;
    if (kind === 'reseat' && !s.removed) return;
    const valid = g.kind === 'pax', allowed = valid && g.group <= s.call, displaced = this.isDisplaced(g);
    const gl = g.group === 0 ? '事前改札' : `グループ${g.group}`;
    let pts = 0, ok = true, msg = '', good = '', staff = '';
    if (kind === 'scan' || kind === 'reseat') {
      staff = DATA.staff.gScan;
      if (!valid) { pts = SC.gWrongBoard; ok = false; msg = `別の便(${g.flightNo})のお客様を通してしまった。降りてもらうため出発が遅れる`; s.extraDelay += 4 * 60; g.state = 'gone'; }
      else if (!allowed) { pts = SC.gEarlyBoard; ok = false; msg = `まだ案内していない${gl}のお客様を通した`; g.state = 'boarded'; }
      else if (kind === 'reseat' && displaced) {
        const used = new Set(s.list.map((x) => x.seat));
        const free = Seats.all('Y').filter((x) => Seats.row(x) <= 10 && !Seats.isExit(x) && !used.has(x));   // 非常口座席は条件確認が必要なので使わない
        const old = g.seat; g.seat = free.length ? U.pick(free) : '10C';
        pts = SC.gReseat; good = `なくなった${old}の座席を${g.seat}に変更して通した`; staff = Talk.fill(DATA.staff.gReseat, { seat: g.seat }); g.state = 'boarded'; s.scanned++;
      } else if (kind === 'reseat') { pts = SC.gReseatExtra; ok = false; msg = '座席を変える必要のないお客様の座席を変更してしまった'; g.state = 'boarded'; }
      else if (displaced) { pts = SC.gReseatMiss; ok = false; msg = `なくなった座席(${g.seat})のまま通してしまった。機内に座る席がない`; g.state = 'boarded'; }
      else { pts = SC.gBoard; g.state = 'boarded'; s.scanned++; }
    } else if (kind === 'hold') {
      if (!valid) { staff = 'もう少々お待ちください。'; pts = SC.gWrongWait; ok = false; msg = `別の便(${g.flightNo})だと気づかず、待たせてしまった`; g.state = 'gone'; }
      else if (!allowed) { staff = Talk.fill(DATA.staff.gHold, { g: g.group }); pts = SC.gHold; g.state = 'lounge'; g.heldOnce = true; good = `${gl}のお客様に、順番まで待っていただいた`; }
      else { staff = 'もう少々お待ちください。'; pts = SC.gWrongHold; ok = false; msg = `案内中の${gl}のお客様を待たせてしまった`; g.state = 'lounge'; g.heldOnce = true; Game.addSat(-3); }
    } else {
      staff = Talk.fill(DATA.staff.gRedirect, { flight: s.f.num, gate: g.gate });
      if (!valid) { pts = SC.gRedirect; g.state = 'gone'; good = `${g.flightNo}便のお客様を${g.gate}番搭乗口へご案内`; }
      else { pts = SC.gWrongRedirect; ok = false; msg = s.ev.newGate && g.gate === s.ev.oldGate ? '搭乗口変更前の番号を見て、この便のお客様を別のゲートへ行かせてしまった' : 'この便のお客様を別のゲートへ行かせてしまった'; g.state = 'away'; g.arriveAt = Game.day.clock + 6 * 60; Game.addSat(-6); staff = 'こちらは別の便の搭乗口です…。'; }
    }
    Game.addScore('gate', pts); Game.decision(ok);
    const name = `${g.family} ${g.given}`;
    if (!ok) { Game.log({ area: 'gate', ok: false, name, flight: g.flightNo, text: msg, pts }); Toast.show(`<b>ミス</b> ${msg} <span class="pts">${U.signed(pts)}</span>`, 'bad', 4600); Sfx.buzz(); }
    else if (good) { Game.log({ area: 'gate', ok: true, name, flight: g.flightNo, text: good, pts }); Toast.show(`<b>正解</b> ${good} <span class="pts">${U.signed(pts)}</span>`, 'ok'); Sfx.good(); }
    else Sfx.beep();
    s.busy = true;
    this.renderReader(null, kind, staff); this.renderActs();
    setTimeout(() => {
      if (Game.scene !== this) return;
      s.cur = null; s.busy = false; s.curIn = 0.04;
      this.renderReader(); this.renderActs(); this.renderStatus(); this.renderAnnButtons(); this.renderSign();
    }, ok && kind === 'scan' ? 230 : 480);
  },

  tryClose() {
    const s = this.s;
    if (!this.canClose()) return;
    const missing = this.act().filter((g) => g.state === 'away' || g.state === 'lounge');
    if (!missing.length) { this.close([]); return; }
    const since = s.finalAt !== null ? Math.floor((Game.day.clock - s.finalAt) / 60) : 0;
    Modal.show({
      title: `まだ${missing.length}名のお客様が来ていません`,
      body: `<ul class="missing-list">${missing.map((g) => `<li><span>${U.esc(g.family)} ${U.esc(g.given)}</span><span class="mono">${g.seat}</span>${g.hasBag ? '<span class="pill warn">預け荷物あり</span>' : '<span class="pill">荷物なし</span>'}</li>`).join('')}</ul>
        <p>最終案内から約${since}分。もうすぐ来るかもしれません。締め切ると、預け荷物があるお客様の分は荷物の取り降ろしで出発が遅れます。</p>`,
      actions: [{ label: 'もう少し待つ', cls: 'ghost' }, { label: '搭乗を締め切る', cls: 'danger', run: () => this.close(missing) }],
    });
  },

  close(missing) {
    const s = this.s, d = Game.day, f = s.f, SC = CONFIG.score;
    s.closed = true; s.waiting = false; f.phase = 'closed';
    let offload = 0;
    for (const g of missing) {
      const name = `${g.family} ${g.given}`;
      if (g.neverShow) {
        Game.addScore('gate', SC.gNoShowHandled); Game.decision(true);
        if (g.hasBag) offload += DATA.rules.offloadMin;
        Game.log({ area: 'gate', ok: true, name, flight: f.no, text: `最後まで来なかったため締め切った${g.hasBag ? '(預け荷物を取り降ろし)' : ''}`, pts: SC.gNoShowHandled });
      } else {
        Game.addScore('gate', SC.gLeftBehind); Game.decision(false); Game.addSat(-10);
        Game.log({ area: 'gate', ok: false, name, flight: f.no, text: 'もうすぐ来るところだったのに、置いて締め切ってしまった', pts: SC.gLeftBehind });
      }
    }
    const lateMin = Math.ceil((Math.max(0, d.clock - f.door) + s.extraDelay) / 60);
    f.delay = lateMin + offload;
    f.actualDep = f.dep + f.delay * 60;
    const act = this.act();
    d.stats.scanned = s.scanned;
    d.gateStats = { boarded: act.filter((g) => g.state === 'boarded').length, total: act.length, lateMin, offload, closeAt: d.clock };
    if (lateMin === 0) { Game.addScore('gate', SC.gOnTime); Game.decision(true); Game.log({ area: 'gate', ok: true, name: '—', flight: f.no, text: `${U.hm(d.clock)} にドアクローズ。定刻どおり`, pts: SC.gOnTime }); }
    else { const pts = lateMin * SC.gDelayPerMin; Game.addScore('gate', pts); Game.decision(false); Game.log({ area: 'gate', ok: false, name: '—', flight: f.no, text: `ドアクローズが${lateMin}分遅れた`, pts }); }
    d.onTime = lateMin === 0;
    s.announce = `${f.num}便、${f.ap.name}行きの搭乗手続きを締め切りました。`;
    Sfx.chimeEnd();
    this.renderAll();
    setTimeout(() => {
      if (Game.scene !== this) return;
      f.phase = 'departed'; Hud.redrawBoard();
      Modal.show({
        title: `${f.no}便 出発`,
        body: f.delay
          ? `<p><b>${U.hm(f.actualDep)}</b> に出発しました(定刻 ${U.hm(f.dep)})。</p><p>${lateMin ? `ドアクローズの遅れ ${lateMin}分` : ''}${lateMin && offload ? '、' : ''}${offload ? `手荷物の取り降ろし ${offload}分(やむを得ない遅れ)` : ''}</p>`
          : `<p>${U.hm(f.dep)} 定刻で出発しました。おつかれさまでした。</p>`,
        actions: [{ label: '今日の結果を見る', cls: 'primary', run: () => Game.go('result') }],
      });
    }, 1100);
  },
};

/* ===== 45-lounge.js ===== */
/* ---------- ラウンジ受付(チーフになると加わる仕事) ---------- */
Scenes.lounge = {
  timed: true,
  N: 8,

  // お客様を作る(ひっかけ:期限切れのカード・他人のカード・他社や明日の搭乗券)
  gen(d) {
    const flights = [d.gateFlight, ...d.fillers];
    const out = [];
    for (let i = 0; i < this.N; i++) {
      const f = U.pick(flights);
      const nat = f.ap.intl && U.chance(0.4) ? (f.ap.country || 'US') : 'JP';
      const per = Gen.person(nat);
      const cls = U.chance(0.4) ? 'J' : 'Y';
      const x = U.r(), tier = x < 0.28 ? null : x < 0.44 ? 'SILVER' : x < 0.72 ? 'GOLD' : 'PLATINUM';
      const seat = cls === 'J' ? U.pick(['1A', '1C', '2D', '2F']) : `${U.int(3, 12)}${U.pick(['A', 'B', 'C', 'D', 'E', 'F'])}`;
      const g = {
        id: Gen.uid++, kind: 'pax', ...per, title: per.sex === 'M' ? 'MR' : 'MS', age: U.int(24, 72),
        companions: U.weighted([0, 1, 2], [6, 3.5, 1.3]), cls,
        pass: { family: per.family, given: per.given, title: per.sex === 'M' ? 'MR' : 'MS', flightNo: f.no, dest: f.dest, date: d.date, gate: f.gate, boarding: U.hm(f.dep - 1800), seat, group: Seats.group(seat), priority: false, cls, air: 'TB' },
        card: tier ? { tier, name: `${per.family} ${per.given}`, no: 'TB ' + U.digits(4) + ' ' + U.digits(4), expiry: U.addDays(d.date, U.int(20, 700)) } : null,
      };
      g.compAv = Array.from({ length: g.companions }, () => Gen.avatar(nat, U.chance(0.5) ? 'M' : 'F'));
      const t = U.r();
      if (t < 0.11 && g.card) g.card.expiry = U.addDays(d.date, -U.int(3, 200));
      else if (t < 0.21 && g.card) { const o = Gen.person(nat); g.card.name = `${o.family === per.family ? Gen.tweak(o.family) : o.family} ${o.given}`; }
      else if (t < 0.28) { Object.assign(g.pass, { air: 'HY', airEn: 'HAYATE AIR', flightNo: 'HY ' + U.int(101, 899) }); }
      else if (t < 0.34) g.pass.date = U.addDays(d.date, 1);
      out.push(g);
    }
    return out;
  },

  // 正解(ok / fee / no)と、その理由
  answer(g, d) {
    const nm = `${g.family} ${g.given}`;
    const passOk = g.pass.air === 'TB' && g.pass.date === d.date;
    const cardOk = !!g.card && g.card.expiry >= d.date && g.card.name === nm;
    const tier = cardOk ? g.card.tier : null;
    let why = '';
    if (g.pass.air !== 'TB') why = '他社の搭乗券だった';
    else if (g.pass.date !== d.date) why = '今日の便の搭乗券ではなかった';
    else if (g.card && !cardOk) why = g.card.expiry < d.date ? '会員カードの有効期限が切れていた' : '会員カードの名前が搭乗券と違った(他人のカード)';
    if (!passOk || !(g.cls === 'J' || tier === 'GOLD' || tier === 'PLATINUM')) {
      return { ans: 'no', why: why || (g.card ? 'シルバー会員でエコノミーの方は入れない' : '会員でなくエコノミーの方は入れない') };
    }
    const free = tier === 'PLATINUM' ? 1 : 0;
    if (g.companions > free) return { ans: 'fee', why: free ? 'プラチナ会員の無料は同伴1名まで' : 'お連れの方はラウンジ券(有料)' };
    return { ans: 'ok', why: g.cls === 'J' ? 'ビジネスクラスの方' : `${DATA.tiers[tier].name}会員の方` + (g.companions ? '(同伴1名まで無料)' : '') };
  },

  enter() {
    const d = Game.day;
    this.s = { guests: this.gen(d), idx: 0, cur: null, busy: false, ok: 0, ng: 0, log: [] };
    if (!Store.data.jobSeen.lounge) { Store.data.jobSeen.lounge = true; Store.save(); }
    document.getElementById('app').innerHTML = Hud.frame(`<div class="job-scene">
      <section class="panel job-rules" aria-label="ラウンジのルール">
        <header class="ph"><b>入室のルール</b><small>LOUNGE RULES</small></header>
        <ul class="rule-list">
          <li><b>入れる</b>ビジネス(J)の搭乗券 / ゴールド・プラチナ会員</li>
          <li><b>入れない</b>エコノミーで、シルバー会員か会員でない方</li>
          <li><b>同伴者</b>プラチナ会員は1名まで無料。それ以外は有料</li>
          <li><b>確認</b>TBの今日の便か。カードの名前と有効期限</li>
        </ul>
        <div class="job-prog" id="jprog"></div>
      </section>
      <section class="g-center">
        <div class="g-sign job-sign"><div class="gs-num lounge"><small>LOUNGE</small>TB</div><div class="gs-info"><div class="gs-flight">つばさラウンジ</div><div class="gs-dest">TSUBASA LOUNGE <span>ラウンジ受付</span></div></div></div>
        <div class="reader" id="reader" aria-live="polite"></div>
        <div class="acts g-acts" id="jacts"></div>
        <p class="g-keys">キーボード: <span class="kbd">1</span>ご案内 <span class="kbd">2</span>同伴者は有料 <span class="kbd">3</span>お断り</p>
      </section>
      <section class="panel job-log" aria-label="対応の記録"><header class="ph"><b>対応の記録</b><small>LOG</small></header><ul class="mini-log" id="jlog"></ul></section>
    </div>`);
    this.next();
    Toast.show('ラウンジ受付です。搭乗券と会員カードを見て、入れるかを判断しましょう', 'info', 3800);
  },

  next() {
    const s = this.s;
    s.cur = s.guests[s.idx] || null; s.busy = false;
    if (!s.cur) { this.finish(); return; }
    this.render('in');
  },

  render(anim, outKind, staff) {
    const s = this.s, g = s.cur, el = document.getElementById('reader');
    document.getElementById('jprog').innerHTML = `<div class="g-count"><b>${Math.min(s.idx + 1, this.N)}</b><span>/ ${this.N}人目</span></div><p class="small">正解 ${s.ok} · ミス ${s.ng}</p>`;
    const dis = !g || s.busy ? 'disabled' : '';
    document.getElementById('jacts').innerHTML = `<button class="btn primary" data-act="ok" ${dis}>ご案内する<span class="kbd">1</span></button>
      <button class="btn" data-act="fee" ${dis}>同伴者は有料と案内<span class="kbd">2</span></button>
      <button class="btn danger" data-act="no" ${dis}>お断りする<span class="kbd">3</span></button>`;
    if (!el || !g) return;
    const line = Talk.line({ nat: g.nat, flight: Game.day.gateFlight }, 'lg_' + g.companions);
    const comps = g.compAv.map((av) => `<div class="fig comp">${Art.avatar(av, 'neutral')}</div>`).join('');
    const mood = outKind === 'no' ? 'sad' : outKind ? 'happy' : 'neutral';
    el.innerHTML = `<div class="reader-pax">${Art.figure(g, mood, { extra: comps })}
        ${staff ? `<div class="bubble staff mini"><span class="who">あなた</span>${U.esc(staff)}</div>` : `<div class="bubble mini">${U.esc(line.main)}${line.gloss ? `<small>${U.esc(line.gloss)}</small>` : ''}</div>`}</div>
      <div class="reader-pass lounge-docs ${anim === 'in' ? 'in' : ''} ${outKind ? 'out-hold' : ''}">${Docs.bpass(g.pass)}${g.card ? Docs.memberCard(g.card) : '<div class="doc missing small-doc"><b>会員カードなし</b><small>NO MEMBERSHIP</small></div>'}</div>`;
  },

  onAct(a) { if (a === 'ok' || a === 'fee' || a === 'no') this.decide(a); },
  onKey(e) { const k = e.key; if (k === '1') this.decide('ok'); else if (k === '2') this.decide('fee'); else if (k === '3') this.decide('no'); },

  decide(kind) {
    const s = this.s, g = s.cur, d = Game.day; if (!g || s.busy) return;
    const { ans, why } = this.answer(g, d), ok = kind === ans, pts = ok ? 40 : -80;
    const name = `${g.family} ${g.given}`;
    const labels = { ok: 'ご案内', fee: '同伴者は有料', no: 'お断り' };
    Game.addScore('mid', pts); Game.decision(ok);
    if (ok) { s.ok++; Sfx.good(); Toast.show(`<b>正解</b> ${labels[ans]}(${why}) <span class="pts">${U.signed(pts)}</span>`, 'ok', 2600); }
    else { s.ng++; Game.addSat(-4); Sfx.buzz(); Toast.show(`<b>ミス</b> 正しくは「${labels[ans]}」。${why} <span class="pts">${U.signed(pts)}</span>`, 'bad', 4600); }
    Game.log({ area: 'mid', ok, name, flight: g.pass.flightNo, text: ok ? `${labels[ans]}(${why})` : `「${labels[kind]}」にしたが、正しくは「${labels[ans]}」。${why}`, pts });
    document.getElementById('jlog').insertAdjacentHTML('afterbegin', `<li class="${ok ? 'ok' : 'bad'}"><span>${ok ? 'OK' : 'ミス'}</span>${U.esc(name)} · ${labels[kind]}</li>`);
    s.busy = true;
    this.render(null, kind, DATA.staff.lounge[kind]);
    setTimeout(() => { if (Game.scene !== this) return; s.idx++; this.next(); }, ok ? 650 : 1100);
  },

  update(dt) { Hud.tick(dt, 0); },

  finish() {
    const s = this.s, gf = Game.day.gateFlight;
    Modal.show({
      title: 'ラウンジ受付 終了',
      body: `<div class="sumgrid three"><div><small>正解</small><b>${s.ok}</b></div><div><small>ミス</small><b>${s.ng}</b></div><div><small>ここでの点数</small><b>${U.fmt(Game.day.score.mid)}</b></div></div>
        <p>次は <b>${gf.gate}番搭乗口</b> で <b>${gf.no}</b> の搭乗案内です。</p>`,
      actions: [{ label: `${gf.gate}番搭乗口へ向かう`, cls: 'primary', run: () => Game.go('gate') }],
    });
  },
};

/* ===== 46-baggage.js ===== */
/* ---------- 手荷物の仕分け(スーパーバイザーになると加わる仕事) ---------- */
Scenes.baggage = {
  timed: true,
  N: 18,

  gen(d) {
    const flights = d.flights.filter((f) => !f.canceled);
    const hubs = flights.filter((f) => DATA.onward[f.dest]);
    const here = new Set(flights.map((f) => f.dest));
    const others = Object.keys(DATA.airports).filter((k) => !here.has(k));
    const out = [];
    for (let i = 0; i < this.N; i++) {
      const r = U.r(), f = U.pick(flights);
      const b = { id: i, color: U.pick(['#c0392b', '#2f6fdb', '#2b2f36', '#e0a526', '#6a8f3a', '#8b52c9', '#9aa4ad', '#d06a2b']), name: U.pick(DATA.names.JP.family), priority: U.chance(0.15), fragile: U.chance(0.1) };
      if (r < 0.08) b.kind = 'notag';
      else if (r < 0.16) Object.assign(b, { kind: 'xray', f });
      else if (r < 0.22 && others.length) { const k = U.pick(others); Object.assign(b, { kind: 'other', tag: { no: 'TB ' + (Number(f.num) + U.pick([12, 24, 36])), dest: k } }); }
      else if (r < 0.36 && hubs.length) { const h = U.pick(hubs); Object.assign(b, { kind: 'through', f: h, final: U.pick(DATA.onward[h.dest]) }); }
      else Object.assign(b, { kind: 'normal', f });
      out.push(b);
    }
    return out;
  },

  // 正しい行き先(便名 / office / inspect)
  cart(b) { return b.kind === 'notag' || b.kind === 'other' ? 'office' : b.kind === 'xray' ? 'inspect' : b.f.no; },
  why(b) {
    return { notag: 'タグが取れている荷物は事務所へ', other: 'この空港で担当していない便のタグは事務所へ', xray: 'X線で要確認の荷物は検査へ', through: `乗り継ぎ(${b.final} via ${b.f && b.f.dest})は ${b.f && b.f.no} のカートへ`, normal: `${b.f && b.f.no} のカートへ` }[b.kind];
  },

  enter() {
    const d = Game.day;
    const flights = d.flights.filter((f) => !f.canceled);
    this.s = { bags: this.gen(d), idx: 0, t: 0, limit: 6, busy: false, ok: 0, ng: 0, flights };
    if (!Store.data.jobSeen.baggage) { Store.data.jobSeen.baggage = true; Store.save(); }
    document.getElementById('app').innerHTML = Hud.frame(`<div class="job-scene">
      <section class="panel job-rules" aria-label="仕分けのルール">
        <header class="ph"><b>仕分けのルール</b><small>RULES</small></header>
        <ul class="rule-list">
          <li><b>ふつう</b>タグの便名のカートへ</li>
          <li><b>乗り継ぎ</b>大きな行き先ではなく「via」と便名を見る</li>
          <li><b>事務所</b>タグが取れている / 担当していない便</li>
          <li><b>検査</b>X線で「要確認」</li>
          <li><b>時間</b>バーがなくなると荷物が流れていってしまう</li>
        </ul>
        <div class="job-prog" id="jprog"></div>
      </section>
      <section class="g-center">
        <div class="g-sign job-sign"><div class="gs-num bag"><small>BAGGAGE</small>BHS</div><div class="gs-info"><div class="gs-flight">手荷物仕分け場</div><div class="gs-dest">BAGGAGE MAKE-UP <span>手荷物の仕分け</span></div></div></div>
        <div class="reader bag-zone" id="belt" aria-live="polite"></div>
        <div class="carts" id="carts"></div>
        <p class="g-keys">キーボード: ${flights.map((f, i) => `<span class="kbd">${i + 1}</span>${f.no}`).join(' ')} <span class="kbd">${flights.length + 1}</span>事務所 <span class="kbd">${flights.length + 2}</span>検査</p>
      </section>
      <section class="panel job-log" aria-label="仕分けの記録"><header class="ph"><b>仕分けの記録</b><small>LOG</small></header><ul class="mini-log" id="jlog"></ul></section>
    </div>`);
    this.renderCarts(); this.renderBelt();
    Toast.show('手荷物の仕分けです。タグを見て、正しいカートへ', 'info', 3600);
  },

  renderCarts() {
    const s = this.s, el = document.getElementById('carts');
    el.innerHTML = s.flights.map((f, i) => `<button class="cart" data-act="to" data-c="${f.no}" style="--c:${f.color}"><span class="kbd">${i + 1}</span><b>${f.no}</b><small>${f.dest} ${f.ap.name}</small></button>`).join('')
      + `<button class="cart office" data-act="to" data-c="office"><span class="kbd">${s.flights.length + 1}</span><b>事務所</b><small>タグなし・担当外</small></button>`
      + `<button class="cart inspect" data-act="to" data-c="inspect"><span class="kbd">${s.flights.length + 2}</span><b>検査</b><small>X線 要確認</small></button>`;
  },

  tag(b) {
    if (b.kind === 'notag') return '<div class="btag torn"><span>タグが取れている</span></div>';
    const no = b.kind === 'other' ? b.tag.no : b.f.no;
    const dest = b.kind === 'other' ? b.tag.dest : b.kind === 'through' ? b.final : b.f.dest;
    return `<div class="btag"><div class="bt-dest">${dest}</div>${b.kind === 'through' ? `<div class="bt-via">via ${b.f.dest}</div>` : ''}<div class="bt-info">${no} / ${U.esc(b.name)}</div>${Art.barcode('b' + b.id + no, 100, 20)}
      ${b.priority ? '<span class="bt-pri">PRIORITY</span>' : ''}${b.fragile ? '<span class="bt-fra">FRAGILE</span>' : ''}</div>`;
  },

  renderBelt(outCls) {
    const s = this.s, el = document.getElementById('belt'), b = s.bags[s.idx];
    document.getElementById('jprog').innerHTML = `<div class="g-count"><b>${Math.min(s.idx + 1, this.N)}</b><span>/ ${this.N}個</span></div><p class="small">正解 ${s.ok} · ミス ${s.ng}</p>`;
    if (!el) return;
    if (!b) { el.innerHTML = '<div class="reader-empty"><b>すべて仕分けました</b></div>'; return; }
    const upcoming = s.bags.slice(s.idx + 1, s.idx + 6).map((x) => `<div class="mini-bag">${Art.suitcase(x.color)}</div>`).join('');
    el.innerHTML = `<div class="belt-line"><div class="belt-strip">${upcoming}</div><small>次の荷物</small></div>
      <div class="bigbag ${outCls || 'in'}">${Art.suitcase(b.color)}${this.tag(b)}${b.kind === 'xray' ? '<div class="xray">X線 要確認<small>リチウム電池の疑い</small></div>' : ''}</div>
      <div class="timer"><i id="tbar" style="width:100%"></i></div>`;
  },

  onAct(a, ds) { if (a === 'to') this.sort(ds.c); },
  onKey(e) {
    const n = +e.key, s = this.s; if (!n) return;
    if (n <= s.flights.length) this.sort(s.flights[n - 1].no);
    else if (n === s.flights.length + 1) this.sort('office');
    else if (n === s.flights.length + 2) this.sort('inspect');
  },

  sort(to, timeout) {
    const s = this.s, b = s.bags[s.idx]; if (!b || s.busy) return;
    const right = this.cart(b), ok = !timeout && to === right;
    const pts = ok ? 20 : timeout ? -40 : -60;
    Game.addScore('mid', pts); Game.decision(ok);
    const where = right === 'office' ? '事務所' : right === 'inspect' ? '検査' : right;
    if (ok) { s.ok++; Sfx.beep(); }
    else {
      s.ng++; Sfx.buzz();
      const msg = timeout ? `間に合わず荷物が流れていった(正しくは ${where})` : `${to === 'office' ? '事務所' : to === 'inspect' ? '検査' : to} に入れたが、正しくは ${where}。${this.why(b)}`;
      Toast.show(`<b>ミス</b> ${msg} <span class="pts">${U.signed(pts)}</span>`, 'bad', 3600);
      Game.log({ area: 'mid', ok: false, name: `${b.name}様の荷物`, flight: b.f ? b.f.no : '—', text: msg, pts });
    }
    document.getElementById('jlog').insertAdjacentHTML('afterbegin', `<li class="${ok ? 'ok' : 'bad'}"><span>${ok ? 'OK' : 'ミス'}</span>${b.kind === 'notag' ? 'タグなし' : this.tag(b).match(/bt-dest">(\w+)/)[1]} → ${timeout ? '流れた' : to === 'office' ? '事務所' : to === 'inspect' ? '検査' : to}</li>`);
    s.busy = true;
    this.renderBelt(ok ? 'out-ok' : 'out-ng');
    setTimeout(() => {
      if (Game.scene !== this) return;
      s.idx++; s.t = 0; s.busy = false;
      s.limit = Math.max(3.2, 6 - s.idx * 0.17);   // だんだん速くなる
      if (s.idx >= this.N) this.finish(); else this.renderBelt();
    }, 260);
  },

  update(dt) {
    const s = this.s;
    Hud.tick(dt, 0);
    if (s.busy || s.idx >= this.N) return;
    s.t += dt;
    const bar = document.getElementById('tbar');
    if (bar) { const k = Math.max(0, 1 - s.t / s.limit); bar.style.width = (k * 100) + '%'; bar.classList.toggle('low', k < 0.3); }
    if (s.t >= s.limit) this.sort(null, true);
  },

  finish() {
    const s = this.s, gf = Game.day.gateFlight;
    if (Modal.open) return;
    const acc = Math.round((s.ok / this.N) * 100);
    Modal.show({
      title: '手荷物の仕分け 終了',
      body: `<div class="sumgrid three"><div><small>正しく仕分け</small><b>${s.ok}/${this.N}</b></div><div><small>正確さ</small><b>${acc}%</b></div><div><small>ここでの点数</small><b>${U.fmt(Game.day.score.mid)}</b></div></div>
        <p>次は <b>${gf.gate}番搭乗口</b> で <b>${gf.no}</b> の搭乗案内です。</p>`,
      actions: [{ label: `${gf.gate}番搭乗口へ向かう`, cls: 'primary', run: () => Game.go('gate') }],
    });
  },
};

/* ===== 47-reserve.js ===== */
/* ---------- 予約カウンター(グランドスタッフに昇進すると加わる仕事) ----------
   お客様の希望(日付・人数・時間・運賃)を聞いて、検索結果の表から正しい便と運賃を選ぶ */

  N: 6,
  FARES: [
    { k: 'flex', name: 'フレックス', note: '変更できる', ahead: 0 },
    { k: 'value', name: 'バリュー', note: '3日前まで', ahead: 3 },

  TIME: {
